name: Setup Bun (checkout + install + cache)
description: |
  统一 Bun 环境准备：Setup Bun → 缓存 node_modules → 安装依赖。
  复用此 action 避免各 job 重复编写相同的 4 个步骤（checkout 由调用方显式执行，
  便于 e2e 等需要多个子项目依赖的场景只 checkout 一次）。
inputs:
  project:
    description: '子项目目录（app 或 client），默认 app'
    required: false
    default: app
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # 固定版本与仓库 `.bun-version` / 本地开发一致（1.4.2）。
        # 2026-10-18：原钉 1.3.14 与 `.bun-version`（1.4.2）漂移 ⇒ ACP WebSocket
        # 契约用例在 CI 上连接超时（Bun 1.3.14 的 node:http upgrade 行为差异）；
        # 统一到 1.4.2 后本地/CI 同版本，避免平台差异测试失败。
        bun-version: 1.4.2

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: ${{ inputs.project }}/node_modules
        # 只用**精确键**（锁文件哈希），不设 `restore-keys` 跨版本回退。
        # 2026-11-27 实证：旧锁的 node_modules 被前缀回退恢复后，`bun install` 不会剔除
        # 「已从依赖里移除」的包 ⇒ `lint:license` 扫到幽灵包 `msg.js@0.0.2`（无 license）
        # 直接把 Static Checks 判红。宁可在锁变更时全量重装，也不接受跨锁混用。
        # `v2` 是**缓存世代盐**：旧键里已经被"回退 + 不剔除"污染（同键仍含幽灵包），
        # 加盐后强制重建一次干净树；后续只有真正改锁才会换键。
        key: ${{ runner.os }}-bun-v2-${{ hashFiles(format('{0}/bun.lock', inputs.project)) }}

    - name: Install dependencies
      shell: bash
      # 冻结安装：CI 必须按锁文件还原，不得联网"顺手"解析出新包（与缓存精确键同口径）。
      run: bun install --frozen-lockfile
      working-directory: ${{ inputs.project }}
