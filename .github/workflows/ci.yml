name: CI Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: bun install

    - name: Run type check
      run: bun run typecheck

    - name: Run linter
      run: bun run lint

    - name: Run tests with coverage
      run: bun test --coverage

    - name: Check coverage threshold (≥60%)
      run: |
        bun test --coverage > coverage_report.txt 2>&1
        cat coverage_report.txt
        coverage=$(grep "All files" coverage_report.txt | awk '{print $4}' | tr -d '%')
        echo "Coverage: $coverage%"
        if (( $(echo "$coverage < 60" | bc -l) )); then
          echo "Error: Coverage $coverage% is below threshold of 60%"
          exit 1
        fi
        echo "Coverage $coverage% meets threshold"

    - name: Run build
      run: bun run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run security scan
      run: bun run security-scan

  command-test:
    name: Command Tests (Phase 1 + 2)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run Phase 1 (Structure Audit)
      run: bun test tests/ci/commands/FullCommandAudit.test.ts

    - name: Run Phase 2 (Actual Execution)
      run: bun test tests/ci/commands/Phase2Execution.test.ts

    - name: Upload test reports as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: command-test-reports
        path: tests/ci/reports/
        retention-days: 30
        if-no-files-found: warn

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run performance tests
      run: bun test tests/ci/performance.test.ts
