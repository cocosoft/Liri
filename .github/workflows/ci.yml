name: CI Test

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.12

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: app/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run type check
      run: bun run typecheck

    - name: Run linter
      run: bun run lint

    - name: "Console usage gate (baseline: 2009)"
      run: |
        COUNT=$(grep -rn "console\.\(log\|warn\|error\|info\|debug\|trace\)(" \
          --include="*.ts" --include="*.tsx" \
          src/ \
          | grep -v "node_modules" \
          | grep -v "\.test\." \
          | grep -v "/tests/" \
          | wc -l)
        echo "Console calls: $COUNT (baseline: 2009)"
        if [ "$COUNT" -gt 2009 ]; then
          echo "FAIL: Console calls ($COUNT) exceed baseline (2009)"
          echo "Please migrate new console calls to Logger or justify the exemption."
          exit 1
        fi
        echo "PASS: Console calls within baseline"

    - name: Run tests (without coverage)
      run: bun test tests/

    - name: Generate coverage report (JSON)
      run: bun test --coverage --reporter=json tests/ > coverage.json 2>&1 || true

    - name: Check coverage threshold (at least 60%)
      run: |
        node -e "
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('coverage.json', 'utf-8'));
          const pct = report.total.lines.pct;
          console.log('Coverage: ' + pct + '%');
          if (pct < 60) {
            console.log('Error: Coverage ' + pct + '% is below threshold of 60%');
            process.exit(1);
          }
          console.log('Coverage ' + pct + '% meets threshold');
        "

    - name: Run build
      run: bun run build

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.12

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: app/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run security scan
      run: bun run security-scan --ci

  circular-check:
    name: Circular Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: app/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Check circular dependencies (baseline at most 11)
      run: |
        OUTPUT=$(npx madge --circular --extensions ts,tsx src/ 2>&1) || true
        echo "$OUTPUT"
        COUNT=$(echo "$OUTPUT" | grep -oP 'Found \K\d+' || echo "0")
        echo "Found $COUNT circular dependencies"
        if [ "$COUNT" -gt 11 ]; then
          echo "FAIL: Circular dependency count ($COUNT) exceeds baseline (11)"
          exit 1
        fi
        echo "PASS: Within baseline limit (at most 11)"
      working-directory: app

  command-test:
    name: Command Tests (Phase 1 + 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.12

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: app/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run Phase 1 (Structure Audit)
      run: bun test tests/ci/commands/FullCommandAudit.test.ts

    - name: Run Phase 2 (Actual Execution)
      run: bun test tests/ci/commands/Phase2Execution.test.ts

    - name: Upload test reports as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: command-test-reports
        path: tests/ci/reports/
        retention-days: 30
        if-no-files-found: warn

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.12

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: app/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run performance tests
      run: bun test tests/ci/performance.test.ts

  client-test:
    name: Client Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: client/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('client/bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run type check
      run: bun run typecheck

    - name: Run tests
      run: bun run test

    - name: Run build
      run: bun run build
