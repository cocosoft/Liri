name: CI Test

on:
  push:
    branches: [ main, develop ]
    # P1-2：纯文档/规则/spec 改动由 `doc-gate.yml`（不设 paths-ignore）承接文档门禁，
    # 避免"文档改动不触发任何检查"（工作流级 paths-ignore 无法按 job 细分）。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  pull_request:
    branches: [ main, develop ]
    # P1-2：纯文档/规则/spec 改动由 `doc-gate.yml`（不设 paths-ignore）承接文档门禁，
    # 避免"文档改动不触发任何检查"（工作流级 paths-ignore 无法按 job 细分）。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: app

    - name: Run type check
      # macOS runner（arm64，3 vCPU / 7GB）上 `tsc --noEmit` 实测 OOM：
      # `FATAL ERROR: Ineffective mark-compacts near heap limit ... exit 134`（连续多轮复现）。
      # V8 默认 old-space 上限按系统内存估算，本项目 ~4100 源文件 + 950 测试文件不够用 ⇒ 显式抬高。
      env:
        NODE_OPTIONS: '--max-old-space-size=6144'
      run: bun run typecheck

    # ---------------------------------------------------------------------
    # Windows 兜底沙箱（2026-10-26，`.trae/specs/windows-sandbox.md` 步骤 4）
    # 本机可编译、可自证；这里在 windows runner 上做**同一件事**：先编译 helper，
    # 再跑 4 条 low-IL 写隔离断言（Low 目录可写 / Medium 拒写 / exit125 透传 / 系统文件可读）。
    # 编译产物落在 <PROJECT_DIR>/bin（已 gitignore），不参与任何提交。
    # ---------------------------------------------------------------------
    - name: Build win-sandbox helper (low IL + job object)
      if: matrix.os == 'windows-latest'
      run: bun run build:win-sandbox

    - name: Verify Windows sandbox (low IL write isolation)
      if: matrix.os == 'windows-latest'
      run: bun run verify:win-sandbox

    - name: Run linter
      # 静态检查与平台无关；macOS runner 内存较小，eslint 全量扫描会 OOM
      # （2026-10-18 实测：`FATAL ERROR: Ineffective mark-compacts near heap limit` ⇒ exit 134）。
      # 只在 ubuntu 上跑一次；其余平台仍跑 typecheck + 全量测试。
      if: matrix.os == 'ubuntu-latest'
      # 失败时把 eslint 的具体诊断**提升为 annotation**：Actions 的 job 日志下载接口
      # 需要仓库 admin 权限（未授权调用返回 403），而 check-run annotations 可匿名读取
      # ⇒ 没有这一步，红只会表现成一句 "Process completed with exit code 1"（2026-10-23 实证）。
      run: |
        set +e
        out=$(bun run lint 2>&1)
        code=$?
        set -e
        if [ "$code" -ne 0 ]; then
          printf '%s\n' "$out" | grep -E 'error|✖|problems|Parsing' | tail -n 20 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
          exit "$code"
        fi
        printf '%s\n' "$out" | tail -n 3

    - name: "Run root scripts linter (待办 ⑨：scripts/** 原先不在 eslint 覆盖内)"
      # 同上：静态检查，单平台执行即可。
      if: matrix.os == 'ubuntu-latest'
      run: bun run lint:scripts

    # R05-003 双源收敛（2026-10-14）：原先此处为**内联 grep**（6 名 / 按行 / 阈值写死 2034），
    # 与门禁 `lint-architecture.ts#checkConsoleBaseline`（4 名 / 按次 / 阈值 2045+10% ⇒ 上限 2250）
    # 构成**两套实现 + 两个阈值**（改一处即漂移）。现改调**同一实现** `scripts/lib/consoleCalls.ts`，
    # 阈值读**同一真源** `scripts/console-baseline.json`（count 2034 / threshold 0 ⇒ 上限 2034，
    # 与原有严格度**逐字一致**，零放宽）。基线缺失/非法 ⇒ 脚本 fail-closed 退出 1。
    - name: "Console baseline gate (R05-003 · 单一实现 + 单一真源)"
      working-directory: .
      run: bun run scripts/check-console-baseline.ts

    # U-03（2026-10-19）：工具名分支棘轮门禁进 CI（此前只在 package.json 定义、
    # 从未被 `ci` 脚本或本工作流调用 ⇒ 存量 11 处无人看守）。
    - name: "Tool-name branches ratchet (U-03)"
      if: matrix.os == 'ubuntu-latest'
      run: bun run lint:toolname-branches

    # U-03（2026-10-19）：能力/风险声明棘轮（扫描面已扩到 `implements Tool` +
    # `src/knowledge/tools/**`，工具类 62 → 81）。此前只在 package.json#ci 定义，
    # 本工作流未单独调用 ⇒ 新增 `implements Tool` 类缺声明时 CI 不会红。
    - name: "Tool capability ratchet (U-03)"
      if: matrix.os == 'ubuntu-latest'
      run: bun run lint:tool-schema

    - name: Select tests (incremental)
      id: select
      shell: bash
      env:
        CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: bun run scripts/select-tests.ts --base "$CI_BASE_SHA" --out "$RUNNER_TEMP/selected-tests.txt"

    - name: Run tests (incremental, full fallback)
      shell: bash
      env:
        # 真链 E2E 必须执行（2026-10-25）：job 内找不到 Python 解释器 ⇒ 该组**报红**（不静默 skip）。
        # 与 `SANDBOX_NEGATIVE_REQUIRE=1` 同口径：环境不满足即失败，不把「没跑」当「通过」。
        PYTHON_E2E_REQUIRE: '1'
      # 门禁自证 / 集成类用例会 spawn `bun`/lint 脚本：实测 Linux 容器 8–28s，
      # 超过 bun test 默认 5s ⇒ CI 上稳定超时假红。统一放宽到 30s（仍为有界）。
      run: |
        set +e
        SEL="$RUNNER_TEMP/selected-tests.txt"
        if [ -f "$SEL" ] && grep -q '^__SKIP__$' "$SEL"; then
          echo "文档-only 变更：跳过测试（其它门禁照常）"
          exit 0
        elif [ -s "$SEL" ]; then
          echo "增量测试：$(grep -c '' "$SEL") 个文件"
          out=$(bun test $(cat "$SEL") --timeout 30000 2>&1); code=$?
        else
          echo "全量测试"
          out=$(bun test tests/ --timeout 30000 2>&1); code=$?
        fi
        printf '%s\n' "$out"
        if [ "$code" -ne 0 ]; then
          # 失败摘要**提升为 annotation**：Actions job 日志接口对未授权读取返回 403，
          # 只有 annotation 能被匿名取到 ⇒ 否则只剩「红了但不知道哪条用例」
          # （2026-10-24 实证：macOS 两次红都无法定位具体用例）。
          printf '%s\n' "$out" | grep -E '\(fail\)' | head -n 20 | while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done
        fi
        exit "$code"

    - name: Generate coverage report (lcov)
      # 覆盖率需要**全量**样本；增量/文档-only 运行跳过（其它门禁照常）。
      # 且 lcov 只在一台 runner 上生成即可（原三平台各跑一遍纯属浪费）。
      if: matrix.os == 'ubuntu-latest' && steps.select.outputs.mode == 'full'
      # 2026-08-15 回归修复：曾加 --coverage-reporter=text 用于日志摘要，
      # 但在 ubuntu/macos 的 bun 1.3.14 上该组合失败（Test Suite #572）；
      # 2026-10-18 起 CI 统一 1.4.2（见 .github/actions/setup-bun），该回退保留待复核。
      # 回退为单 lcov reporter，统计能力由上传的 lcov.info artifact 承担。
      run: bun test --coverage --coverage-reporter=lcov tests/

    - name: Check coverage threshold (at least 18%)
      if: matrix.os == 'ubuntu-latest' && steps.select.outputs.mode == 'full'
      run: bun run scripts/check-coverage-threshold.ts 18

    - name: Upload coverage report
      if: matrix.os == 'ubuntu-latest' && steps.select.outputs.mode == 'full'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.os }}
        path: app/coverage/lcov.info
        retention-days: 30
        if-no-files-found: warn

    - name: Run build
      run: bun run build

    - name: Check version consistency
      if: matrix.os == 'ubuntu-latest'
      run: node scripts/check-version-consistency.js
      working-directory: .
      shell: bash

  cargo-build:
    name: Rust Native Build (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/native

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('app/native/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: app/native/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('app/native/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Run cargo check (native core)
      run: cargo check

    - name: Run cargo build (release)
      run: cargo build --release
      continue-on-error: true

  static-check:
    name: Static Checks (security + circular + architecture)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: app

    - name: Run security scan
      run: bun run security-scan --ci

    - name: Run dependency audit
      run: bun audit --ignore-fixes
      continue-on-error: true

    - name: Dependency license compliance (R12 · graded / non-blocking)
      # §5.3-2：漏洞扫描已由上方 `bun audit` 承担；此处补**许可证**扫描（离线）。
      # 分级：默认仅报告不阻断（`--fail-on=…` 可收紧）。
      working-directory: .
      run: bun run scripts/check-license-compliance.ts
      continue-on-error: true

    - name: Check circular dependencies (baseline at most 0)
      # 2026-10-19：断环收口 24 → 0（类型/契约下沉，零运行时变化）⇒ 棘轮收紧到 0，只减不增。
      run: |
        OUTPUT=$(npx madge --circular --extensions ts,tsx src/ 2>&1) || true
        echo "$OUTPUT"
        COUNT=$(echo "$OUTPUT" | grep -oP 'Found \K\d+' || echo "0")
        echo "Found $COUNT circular dependencies"
        if [ "$COUNT" -gt 0 ]; then
          echo "FAIL: Circular dependency count ($COUNT) exceeds baseline (0)"
          exit 1
        fi
        echo "PASS: No circular dependencies"

    - name: Run architecture compliance check
      working-directory: .
      run: |
        bun run scripts/lint-architecture.ts

    # 内核纯净度（P0，`dev_docs/20261023/微内核-core-拆分方案.md` §5）
    #   口径：棘轮 + **error 级** —— 基线 `.trae/architecture/kernel-purity-baseline.json`
    #   只减不增；新增 core→上层 的静态/动态泄漏、或 core 出工作区的引用 ⇒ exit 1。
    #   基线缺失视为空基线（现存 11 条已登记，故正常情况必红）⇒ 事实上的 fail-closed。
    - name: Kernel purity gate (K01-K04 + K06 deps + K07 deep paths + baseline ratchet)
      working-directory: .
      run: |
        bun run scripts/lint-kernel-purity.ts
        # 导出面快照（P0-f）：内核 public API 的破坏性变更必须经评审后重写快照
        bun run scripts/kernel-api-surface.ts --check
        # 别名回归（P5）：`@modules/core` 已统一为 `@openliri/kernel`，禁止回流
        bun run scripts/codemod-core-imports.ts --check

    # 变体矩阵自洽 + **恒保留工具的能力前置覆盖**（K05 修正版）
    #   原口径「MANDATORY_TOOLS ⊆ 变体 features」与实现相反（core 按设计排除 AGENT/TODO），
    #   真正的复发点是「加了恒集成员却没加 MANDATORY_TOOL_REQUIRES 前置」⇒ 恒可见且不受变体约束。
    - name: Variant matrix gate (single source + mandatory coverage)
      run: bun run lint:variant-matrix

    - name: Run file size check
      working-directory: .
      run: |
        bun run scripts/lint-file-size.ts

    # ══════════════════════════════════════════════
    # 硬编码治理门禁（方案 `dev_docs/20261013/硬编码统一治理方案-20261013.md` §8 阶段③）
    #   口径：**棘轮 + error 级** —— 基线 `.trae/architecture/hardcode-gate-baseline.json`
    #   只减不增；出现基线外的键、或某键计数扩大 ⇒ `exit 1`（**阻断**）。
    #   基线缺失 / 解析失败 ⇒ 同样 `exit 1`（fail-closed，不得静默降级为"0 违规"）。
    # ══════════════════════════════════════════════
    - name: Hardcode gates (§8 阶段③ · ratchet baseline, error level)
      working-directory: .
      run: |
        bun run scripts/lint-consts.ts
        bun run scripts/lint-endpoints.ts
        bun run scripts/lint-locale.ts
        bun run scripts/lint-failmsg-refs.ts
        # 会话预算纪律 SB03：台账/登记类文件「单行超长」棘轮（只减不增）
        bun run scripts/lint-evidence-linewidth.ts
        # 阶段 B：台账视图「生成物一致性」drift（提交物 == 生成结果；仅 CI，方案 Q3 裁定）
        bun run scripts/lint-evidence-views-drift.ts

    - name: Run session regression check (BUG-A/B/C)
      working-directory: .
      run: |
        bun run scripts/lint-session-regression.ts

    - name: Entry scripts explicit exit (lint:exit · 台账 N-16 / N-49)
      working-directory: .
      run: |
        bun run scripts/lint-script-exit.ts

    # ══════════════════════════════════════════════
    # 其余本地门禁入 CI（2026-10-16，台账 LINTEXIT-CI-WIRING 的 reopenWhen ①）
    #   背景：CI 此前已覆盖约 20 项门禁，但下列 7 项此前只在 `app/package.json` 的
    #   `ci` 聚合脚本（**本地全链**）里 ⇒ 本地绿、CI 不拦。
    #   逐项 CI 就绪度已实测（按本文件同样的调用方式、同样的 cwd 实跑）：
    #     · 全绿（exit 0）且**非空扫描**（防"扫了个空也绿"）；
    #     · 各自 ≤ 0.9s；
    #     · 只扫 **tracked 域**（`app/src` / `client/src` / `app/tests` / `scripts/`），
    #       不依赖 `dev_docs/`（本地不推送）与 `~/.pyapp` 数据。
    #   ⚠️ 如实边界（两处）：
    #   ① `lint-models` 的「能力覆盖」子检查**语义上本地专属，在 CI 永远走「未执行」**：它的输入是
    #      **用户启用的模型**（`model_registry where enabled = 1`）⇒ CI/干净环境里跑它只会得到
    #      「每个能力 0 个模型」的**假红**（除非伪造模型数据，违 CS04）⇒ CI 对它只承担
    #      「静态硬编码」那部分的拦截。
    #      2026-10-16 已修好其**本地可用性**（`DB_PATHS` 补 `~/.pyapp/data/app.db`；此前两条候选
    #      都在仓库内 ⇒ 本机也恒跳过），并把它按**用户裁定**降为**告警不阻断**（其发现属
    #      「本机模型配置缺口」而非代码质量违规）；同日再按裁定加入**豁免表**
    #      `INTENTIONALLY_MODEL_LESS`（键 = `task:capability` 精确组合、**理由非空为硬约束**
    #      （空理由即 exit 1）、每条豁免**如实打印**）⇒ 本机对已登记项打印
    #      `⚪ 豁免（已登记「故意无模型」）`，未登记者仍 `⚠️ 告警`，两者都 exit 0；
    #      CI 无该库 ⇒ 打印 `⏭️ 未执行`。台账 `LINTMODELS-CAPABILITY-WARN` / `LINTMODELS-TASK-EXEMPT`
    #      （承 `LINTMODELS-CAPABILITY-SCOPE`、`VOICE-TTS-STT-NO-MODEL-NEEDED`）。
    #   ② **未纳入 `lint:case`**（大小写同名碰撞）：该判据的语义与**文件系统大小写敏感性**
    #      绑定 —— Windows 无法表示仅大小写不同的同级条目，故在本机恒为 0 违规、
    #      **无法验证 ubuntu 行为**；不引入「未验证就接、可能即红」的 CI 项。
    #      若日后要在 CI 验它：直接 `working-directory: . && bun run scripts/lint-case-collision.ts`
    #      并在 ubuntu 上先跑一遍看是否真核出碰撞。
    # ══════════════════════════════════════════════
    - name: Repo-level lint gates (unref / script-refs / mock / no-module-mock / legacy-env / models)
      working-directory: .
      run: |
        bun run scripts/lint-unref.ts
        bun run scripts/lint-script-refs.ts
        bun run scripts/lint-mock.ts
        bun run scripts/lint-no-module-mock.ts
        bun run scripts/lint-legacy-env.ts
        bun run scripts/lint-models.ts

    - name: Tool schema gate (capability/risk 声明棘轮 · app 本地脚本)
      working-directory: app
      run: |
        bun run scripts/lint-tool-schema.ts

    # ══════════════════════════════════════════════
    # 提示词资源门禁（C-1 / C-3b / T2，2026-10-18）
    #   · `prompts:check`       manifest ↔ 目录冻结导出对照（C-1/C-5）
    #   · `params:check`        工具参数描述（359 条）↔ zh-CN 源，en-US 键集/空值
    #   · `descriptions:check`  工具级描述（77 工具）↔ zh-CN 源，en-US 键集/空值
    #   · `lint:prompt-parity|budget|t1`  校验器四门禁中的三项
    #   · `lint:prompt-hardcoded`  源码侧中文硬编码（2026-10-18 起 `--strict` 阻断）
    #   产物与平台无关（纯 fs + 工具实例化）；工具实例化在既有 `bun test tests/` 的
    #   三平台矩阵里已被覆盖 ⇒ 本 job 本身即 ubuntu-only，无需再按 matrix 过滤。
    # ══════════════════════════════════════════════
    - name: Prompt resource gates (C-3b/T2 · manifest + params + descriptions)
      working-directory: app
      run: |
        bun run prompts:check
        bun run params:check
        bun run descriptions:check
        bun run lint:prompt-parity
        bun run lint:prompt-budget
        bun run lint:prompt-t1
        bun run lint:prompt-hardcoded

    # ══════════════════════════════════════════════
    # 能力声明静态一致性门禁（2026-10-16）
    #   兑现 `LINTMODELS-CAPABILITY-SCOPE` 的 reopenWhen ② —— 「另立一个按 tracked 事实源
    #   做静态一致性检查的门禁」（**不是**复活 `lint:models` 的能力覆盖子检查：那条输入是
    #   用户启用的模型，语义本地专属，见本案上方 ①）。
    #   与它的关键区别：本项**输入全在 tracked 域**
    #   （`capabilities.default.yaml` + `app/src/ai/modelRouter.ts` 的 `ALL_TASK_TYPES`），
    #   不读 `~/.pyapp` 的用户数据 ⇒ **CI 与本地同一结论**，无"假红/需伪造数据"问题（CS04）。
    #   判据 C1–C7（全部 error 级）：任务/能力/分类/依赖的**引用完整性** + 唯一性 +
    #   「代码任务类型 ⇒ 必有映射行」（缺映射 ⇒ 用户侧 `mapping_not_found` 告警）。
    # ══════════════════════════════════════════════
    - name: Capability declaration consistency gate (capabilities.default.yaml · tracked 事实源)
      working-directory: app
      run: |
        bun run scripts/lint-capabilities.ts

  # ══════════════════════════════════════════════
  # S3-1 G3（2026-10-11）：**构建变体矩阵** —— typecheck + 工具面/契约门禁
  #   每个变体：生成 `BUILD_VARIANT_FLAGS`（D1 接线后由 `feature()` 消费）→ typecheck →
  #   跑变体相关门禁（工具面清单 + 变体层契约）。
  #   仅 3 个代表变体（core 最小 / coding 默认 / enterprise 最大），**不**跑全量测试（避免 ×N 计费），
  #   对齐方案 S3-1 的"至少 typecheck + 工具面快照"。
  # ══════════════════════════════════════════════
  variant-check:
    name: Build Variant Matrix (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        variant: [core, coding, enterprise]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: app

    - name: Generate variant flags (${{ matrix.variant }})
      run: bun run scripts/build-variant.ts --variant=${{ matrix.variant }}

    - name: Type check (variant flags wired into feature())
      run: bun run typecheck

    - name: Gates (tool-surface list + variant-layer contract)
      env:
        LIRI_BUILD_VARIANT: ${{ matrix.variant }}
      run: bun test tests/tools/toolNameLists.test.ts tests/config/featureFlagContract.test.ts

  command-test:
    name: Command Tests (Phase 1 + 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: app

    - name: Run Phase 1 (Structure Audit)
      run: bun test tests/ci/commands/FullCommandAudit.test.ts

    - name: Run Phase 2 (Actual Execution)
      run: bun test tests/ci/commands/Phase2Execution.test.ts

    - name: Upload test reports as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: command-test-reports
        path: tests/ci/reports/
        retention-days: 30
        if-no-files-found: warn

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: app

    - name: Run performance tests
      run: bun test tests/ci/performance.test.ts

    - name: Download previous baseline
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: performance-baseline
        path: ${{ github.workspace }}/.perf-baseline

    - name: Run startup benchmark
      run: bun run scripts/benchmark-startup.ts
      env:
        LIRI_BENCHMARK_MODE: '1'

    - name: Copy benchmark output for CI artifact
      run: cp docs/performance-baseline.json perf-summary.json

    - name: Compare performance against baseline
      run: |
        BASELINE_FILE="${{ github.workspace }}/.perf-baseline/perf-summary.json"
        if [ -f "$BASELINE_FILE" ]; then
          cp "$BASELINE_FILE" .perf-baseline.json
          bun run ../scripts/compare-performance-baseline.ts \
            --baseline .perf-baseline.json \
            --current perf-summary.json \
            --total-threshold 110 \
            --memory-threshold 115 \
            --phase-threshold 120
        else
          echo "No previous baseline found — this run will establish the first baseline"
        fi

    - name: Upload performance baseline
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: performance-baseline
        path: app/perf-summary.json
        retention-days: 90

  client-test:
    name: Client Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: client

    - name: Run type check
      run: bun run typecheck

    - name: Run tests
      run: bun run test

    - name: Run coverage gate (trajectory module thresholds)
      # P2-4（2026-09-23）：轨迹模块覆盖率门槛（`client/vite.config.ts` test.coverage.thresholds）。
      # 仅 ubuntu 跑一次：门槛与平台无关，无需在 3 个 OS 上重复计费。
      if: matrix.os == 'ubuntu-latest'
      run: bun run test:coverage

    - name: Run build
      run: bun run build

  e2e-test:
    name: E2E Fault Injection Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun + app deps (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: app

    - name: Prepare app config (offline mode)
      working-directory: app
      run: |
        if [ ! -f .env ]; then cp .env.example .env; fi
        echo "app/.env prepared (offline mode, no API keys required)"

    - name: Setup client deps (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: client

    - name: Install Playwright browsers
      working-directory: client
      run: bunx playwright install --with-deps chromium

    - name: Run E2E tests
      working-directory: client
      run: bunx playwright test
      env:
        CI: 'true'

    - name: Upload Playwright report (always, for failure triage)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          client/playwright-report/
          client/test-results/
        retention-days: 7
        if-no-files-found: warn

  # ══════════════════════════════════════════════
  # P1-6 沙箱**真负向**默认门禁（Linux + helper ⇒ **强制跑**，不得静默跳过）
  #   验收：越权写文件未创建 / 越权子进程被拒 / 内容不泄露（真实内核结果，非策略形状断言）
  # ══════════════════════════════════════════════
  sandbox-negative:
    name: Sandbox Real Negative (Linux, required)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: app

    # 构建 landlock-run helper（main.c = 纯 C11 + libc；编译产物不入库）
    - name: Build landlock-run helper
      working-directory: .
      run: |
        set -eu
        OUT="$RUNNER_TEMP/landlock-run"
        cc -static -O2 -Wall -Wextra -o "$OUT" app/src/sandbox/landlock/native/main.c \
          || cc -O2 -Wall -Wextra -o "$OUT" app/src/sandbox/landlock/native/main.c
        "$OUT" --probe || true

    # 真负向**必须执行**：SANDBOX_NEGATIVE_REQUIRE=1 ⇒ 环境不满足即**失败**（不静默跳过）
    - name: Real negative tests (required)
      env:
        LANDLOCK_RUN_HELPER: ${{ runner.temp }}/landlock-run
        SANDBOX_NEGATIVE_REQUIRE: '1'
      run: bun test tests/sandbox/negativeEnforcement.test.ts

  # ══════════════════════════════════════════════
  # R14 分层质量摘要（§6.3）—— 5 层**分列**呈现，**不合成单一分数**
  # ══════════════════════════════════════════════
  quality-summary:
    name: Layered Quality Summary (R14)
    runs-on: ubuntu-latest
    needs: [test, cargo-build, static-check, command-test, performance-test, client-test, e2e-test, sandbox-negative]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: app

    - name: Summarizer self-check (no single score invariant)
      working-directory: .
      run: bun run scripts/quality-summary.ts --self-check

    - name: Render layered quality summary
      # 各层**分列**（静态 / 测试 / 安全 / 可靠性 / 性能）；刻意**不产出总分**。
      # 粒度如实：行值 = 对应 **CI 作业**结果（不把"作业通过"过度声称成某子步骤通过）。
      working-directory: .
      env:
        QS_JSON: |
          {
            "static-checks": "${{ needs.static-check.result }}",
            "test-suite": "${{ needs.test.result }}",
            "client-test": "${{ needs.client-test.result }}",
            "command-test": "${{ needs.command-test.result }}",
            "security-scan": "${{ needs.static-check.result }}",
            "sandbox-negative": "${{ needs.sandbox-negative.result }}",
            "pathshield-e2e": "${{ needs.e2e-test.result }}",
            "e2e-test": "${{ needs.e2e-test.result }}",
            "cargo-build": "${{ needs.cargo-build.result }}",
            "performance-test": "${{ needs.performance-test.result }}"
          }
      run: bun run scripts/quality-summary.ts
