name: CI Test

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.trae/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: app/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run type check
      run: bun run typecheck

    - name: Run linter
      run: bun run lint

    - name: "Console usage gate (baseline: 2034)"
      shell: bash
      run: |
        COUNT=$(grep -rn "console\.\(log\|warn\|error\|info\|debug\|trace\)(" \
          --include="*.ts" --include="*.tsx" \
          src/ \
          | grep -v "node_modules" \
          | grep -v "\.test\." \
          | grep -v "/tests/" \
          | wc -l)
        echo "Console calls: $COUNT (baseline: 2034)"
        if [ "$COUNT" -gt 2034 ]; then
          echo "FAIL: Console calls ($COUNT) exceed baseline (2034)"
          echo "Please migrate new console calls to Logger or justify the exemption."
          exit 1
        fi
        echo "PASS: Console calls within baseline"

    - name: Run tests (without coverage)
      run: bun test tests/

    - name: Generate coverage report (lcov)
      run: bun test --coverage --coverage-reporter=lcov tests/

    - name: Check coverage threshold (at least 18%)
      run: bun run scripts/check-coverage-threshold.ts 18

    - name: Run build
      run: bun run build

    - name: Check version consistency
      if: matrix.os == 'ubuntu-latest'
      run: node scripts/check-version-consistency.js
      working-directory: .
      shell: bash

  cargo-build:
    name: Rust Native Build (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/native

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('app/native/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: app/native/target
        key: ${{ runner.os }}-cargo-build-${{ hashFiles('app/native/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Run cargo check (native core)
      run: cargo check

    - name: Run cargo build (release)
      run: cargo build --release
      continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: app/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run security scan
      run: bun run security-scan --ci

    - name: Run dependency audit
      run: bun audit --ignore-fixes
      continue-on-error: true

  circular-check:
    name: Circular Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: app/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Check circular dependencies (baseline at most 7)
      run: |
        OUTPUT=$(npx madge --circular --extensions ts,tsx src/ 2>&1) || true
        echo "$OUTPUT"
        COUNT=$(echo "$OUTPUT" | grep -oP 'Found \K\d+' || echo "0")
        echo "Found $COUNT circular dependencies"
        if [ "$COUNT" -gt 7 ]; then
          echo "FAIL: Circular dependency count ($COUNT) exceeds baseline (7)"
          exit 1
        fi
        echo "PASS: Within baseline limit (at most 7)"
      working-directory: app

  arch-check:
    name: Architecture Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Run architecture compliance check
      run: |
        bun run scripts/lint-architecture.ts

    - name: Run file size check
      run: |
        bun run scripts/lint-file-size.ts

  command-test:
    name: Command Tests (Phase 1 + 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: app/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run Phase 1 (Structure Audit)
      run: bun test tests/ci/commands/FullCommandAudit.test.ts

    - name: Run Phase 2 (Actual Execution)
      run: bun test tests/ci/commands/Phase2Execution.test.ts

    - name: Upload test reports as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: command-test-reports
        path: tests/ci/reports/
        retention-days: 30
        if-no-files-found: warn

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: app/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run performance tests
      run: bun test tests/ci/performance.test.ts

    - name: Download previous baseline
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: performance-baseline
        path: ${{ github.workspace }}/.perf-baseline

    - name: Run startup benchmark
      run: bun run scripts/benchmark-startup.ts
      env:
        LIRI_BENCHMARK_MODE: '1'

    - name: Copy benchmark output for CI artifact
      run: cp docs/performance-baseline.json perf-summary.json

    - name: Compare performance against baseline
      run: |
        BASELINE_FILE="${{ github.workspace }}/.perf-baseline/perf-summary.json"
        if [ -f "$BASELINE_FILE" ]; then
          cp "$BASELINE_FILE" .perf-baseline.json
          bun run ../scripts/compare-performance-baseline.ts \
            --baseline .perf-baseline.json \
            --current perf-summary.json \
            --total-threshold 110 \
            --memory-threshold 115 \
            --phase-threshold 120
        else
          echo "No previous baseline found — this run will establish the first baseline"
        fi

    - name: Upload performance baseline
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: performance-baseline
        path: app/perf-summary.json
        retention-days: 90

  client-test:
    name: Client Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Cache node_modules
      uses: actions/cache@v4
      with:
        path: client/node_modules
        key: ${{ runner.os }}-bun-${{ hashFiles('client/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install

    - name: Run type check
      run: bun run typecheck

    - name: Run tests
      run: bun run test

    - name: Run build
      run: bun run build
