name: Doc Gate

# P1-2（`dev_docs/20261010/升级优化方案-20261010.md`）：
# 把「文档 ↔ 代码 语义一致性」与「不变量注册表」门禁**接入 GitHub Actions**，
# 且**不设 paths-ignore** —— 使**纯文档/规则/spec 改动**同样触发文档门禁
# （`ci.yml` 为重型套件，其 paths-ignore 仍跳过 `**.md`/`docs/**`/`.trae/**`；
#  文档类改动由本工作流承接，两者互补）。
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  doc-gate:
    name: Doc & Semantics Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun (cache + install)
      uses: ./.github/actions/setup-bun
      with:
        project: app

    # 文档 ↔ 代码 语义一致性（A13 / R11-1）：关键常量 / 安全开关默认值 / A2A 等
    - name: "Doc-code consistency (lint:doc-code)"
      run: bun run lint:doc-code

    # 规则文档里的**导入别名**必须能解析（防「规范悬空」：文档教人写已删除的别名）
    - name: "Doc alias resolvability (lint:doc-alias)"
      run: bun run lint:doc-alias

    # 不变量注册表门禁（P1-1/P1-2）：每条不变量的源码/验证/spec 落点必须可解析；缺口须登记
    - name: "Invariant registry gate (lint:invariants)"
      run: bun run lint:invariants

    # 执行入口注册门禁（P1-3）：扫描命中 ⇄ 登记双向一致；新增入口漏登记即阻断
    - name: "Execution entrypoints gate (lint:entrypoints)"
      run: bun run lint:entrypoints

    # 修复证据登记门禁（P1-4）：四段生命周期与四个独立状态不得混同（无测试不得称"已验收"）
    - name: "Fix evidence gate (lint:fix-evidence)"
      run: bun run lint:fix-evidence

    # GitHub Actions YAML 可解析 + 结构完整（2026-10-24）
    # 实证：`name: Package build (tsc: barrel …)` 里未加引号的 `: ` 让 YAML 变成映射
    # ⇒ GitHub 判整个 workflow 无效，只留一条 0 job 的失败记录；本地 typecheck/eslint 均不解析
    # workflow ⇒ 由不设 paths-ignore 的本工作流承接。
    - name: "GitHub Actions YAML (lint:workflows)"
      run: bun run lint:workflows

    # 超大函数/文件棘轮（P2-1）：`runStreamMessage` 只允许缩小，不允许增长
    - name: "Function-size ratchet (lint:fn-size)"
      run: bun run lint:fn-size

    # 圈复杂度重尾离群棘轮（P2-6）：≥100 的离群函数计数**只允许减少**
    - name: "Complexity ratchet (lint:complexity)"
      run: bun run lint:complexity

    # ══════════════════════════════════════════════
    # 基线棘轮（2026-10-24 补）：这三条的**基线都在 `.trae/architecture/*.json`**，
    # 而 `ci.yml` 的 paths-ignore 含 `.trae/**` ⇒ 只改基线时那条工作流不触发、
    # 消费它的门禁**从不运行**（假绿）。本工作流不设 paths-ignore，故在此承接。
    # 依据：2026-10-24 下调 `hardcode-gate-baseline.json` 时实测「改完基线 CI 无人校验」。
    # ══════════════════════════════════════════════
    - name: "Hardcode ratchet (lint:consts · baseline in .trae/architecture)"
      run: bun run lint:consts

    - name: "State-literal ratchet (lint:state-ratchet · baseline in .trae/architecture)"
      run: bun run lint:state-ratchet

    - name: "Evidence line-width ratchet (lint:evidence-linewidth · baseline in .trae/architecture)"
      run: bun run lint:evidence-linewidth
