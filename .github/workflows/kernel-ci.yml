name: Kernel CI

# 内核独立包（`packages/kernel`）的**快速回路**：
#   只在内核自身或其门禁/基线变动时触发，跑「包内 typecheck / test / build + 内核门禁」，
#   不重复 ci.yml 的全量 lint/test（那是 app 全面回归）。
#
# 为什么仍需 `bun install`（app 目录）：Phase 1 里内核的第三方依赖
# `@opentelemetry/api` 解析自 `app/node_modules`（单副本，见方案 §4-P4 偏差②），
# 且 `test:kernel` 跑的是 app 侧的集成用例。Phase 2 独立发布后本 workflow 应改为
# 在 `packages/kernel` 内 `bun install`。

on:
  push:
    paths:
      - 'packages/kernel/**'
      - 'app/tsconfig.json'
      - 'scripts/lint-kernel-purity.ts'
      - 'scripts/kernel-api-surface.ts'
      - 'scripts/kernel-allowed-deps.json'
      - 'scripts/kernel-io-allowlist.json'
      - 'scripts/codemod-core-imports.ts'
      # 层门禁（lint:arch）的三个真源：内核是它的**第二扫描根**，改这三份会改变内核的
      # 子目录可见性（AC-05：`core/<sub>` 登记后才与 `core` 区分开）⇒ 必须触发内核回路。
      - 'scripts/lint-architecture.ts'
      - 'scripts/modules-to-layers.json'
      - 'scripts/layer-exceptions.json'
      # 内核三份基线（purity / deep-path / size）：`.trae/**` 在 ci.yml 里被 paths-ignore，
      # 只改基线不会触发任何测试 ⇒ 这里显式纳入，避免「改了棘轮上限却没人跑门禁」。
      - '.trae/architecture/kernel-*.json'
      - '.github/workflows/kernel-ci.yml'
      # 三源一致性门禁（tsconfig ↔ exports ↔ K07 白名单）住在 app/tests，
      # 但它是**内核**的守卫 ⇒ 改动它也属内核面变更（B2：抽仓时必须一并带走）。
      - 'app/tests/gates/kernelPurityGate.test.ts'
  pull_request:
    paths:
      - 'packages/kernel/**'
      - 'app/tsconfig.json'
      - 'scripts/lint-kernel-purity.ts'
      - 'scripts/kernel-api-surface.ts'
      - 'scripts/kernel-allowed-deps.json'
      - 'scripts/kernel-io-allowlist.json'
      - 'scripts/codemod-core-imports.ts'
      # 层门禁（lint:arch）的三个真源：内核是它的**第二扫描根**，改这三份会改变内核的
      # 子目录可见性（AC-05：`core/<sub>` 登记后才与 `core` 区分开）⇒ 必须触发内核回路。
      - 'scripts/lint-architecture.ts'
      - 'scripts/modules-to-layers.json'
      - 'scripts/layer-exceptions.json'
      - '.trae/architecture/kernel-*.json'
      - '.github/workflows/kernel-ci.yml'
      - 'app/tests/gates/kernelPurityGate.test.ts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel (typecheck / test / build / gates)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache app node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Package typecheck
        working-directory: packages/kernel
        run: bun run typecheck

      - name: Package tests
        working-directory: packages/kernel
        run: bun run test

      - name: "Package build (tsc · barrel + per-module output)"
        working-directory: packages/kernel
        run: bun run build

      # 产物冒烟（脚本化：prepublishOnly 与 CI 共用同一份断言，见 packages/kernel/scripts/smoke-dist.mjs）：
      #  · exports 无通配（否则内部模块全量公开）
      #  · 每个导出目标真实存在（曾因只产 dist/index.js 导致全部子路径 404）
      #  · **桶与子路径是同一模块实例**（A1：曾因 bun 打桶 + tsc 逐模块产出并存而双副本）
      - name: Build artifact smoke (no wildcards · targets exist · singleton identity)
        working-directory: packages/kernel
        run: bun run smoke

      # 三源一致性（B2）：`app/tests/gates/kernelPurityGate.test.ts` 断言
      # ① app/tsconfig.json 显式映射 ② packages/kernel/package.json exports ③ K07 白名单
      # 三者互相覆盖且无通配。它住在 app/tests，阶段二抽仓时**必须一并抽入内核仓**，
      # 否则内核仓自己不再有这条守卫。
      - name: Three-source consistency (tsconfig ↔ exports ↔ K07 whitelist)
        working-directory: app
        run: bun test tests/gates/kernelPurityGate.test.ts

      # 内核纯净度：K01–K04 跨层 / K06 依赖白名单 / K07 深路径棘轮（均可独立于 app 全量执行）
      - name: Kernel purity gate (K01-K07)
        run: bun run scripts/lint-kernel-purity.ts

      # 层门禁（AC-05 / AC-07）：`scripts/lint-architecture.ts` 的 main() 把内核当**第二扫描根**
      # （`packages/kernel/src`）。此前内核 PR 只跑 K01–K07 ⇒ 跨层与子目录可见性无回归保护。
      # 直接以仓库根为 cwd 执行，避免 AC-25 禁止的 `VAR=value cmd` 前缀写法。
      - name: Kernel layer gate (lint:arch · kernel as second scan root)
        run: bun run scripts/lint-architecture.ts

      # 导出面快照：未评审的破坏性 API 变更直接失败
      - name: Kernel API surface snapshot
        run: bun run scripts/kernel-api-surface.ts --check

      # 旧别名回流检查（`@modules/core` 已统一为 `@openliri/kernel`）
      - name: Forbidden legacy alias
        run: bun run scripts/codemod-core-imports.ts --check

      # app 侧的内核集成回路（tests/core + tests/execution + 事件日志一族）
      - name: Kernel loop (app-side integration)
        working-directory: app
        run: bun run test:kernel
