name: Kernel CI

# 内核独立包（`packages/kernel`）的**快速回路**：
#   只在内核自身或其门禁/基线变动时触发，跑「包内 typecheck / test / build + 内核门禁」，
#   不重复 ci.yml 的全量 lint/test（那是 app 全面回归）。
#
# 为什么仍需 `bun install`（app 目录）：Phase 1 里内核的第三方依赖
# `@opentelemetry/api` 解析自 `app/node_modules`（单副本，见方案 §4-P4 偏差②），
# 且 `test:kernel` 跑的是 app 侧的集成用例。Phase 2 独立发布后本 workflow 应改为
# 在 `packages/kernel` 内 `bun install`。

on:
  push:
    paths:
      - 'packages/kernel/**'
      - 'app/tsconfig.json'
      - 'scripts/lint-kernel-purity.ts'
      - 'scripts/kernel-api-surface.ts'
      - 'scripts/kernel-allowed-deps.json'
      - 'scripts/codemod-core-imports.ts'
      - '.github/workflows/kernel-ci.yml'
  pull_request:
    paths:
      - 'packages/kernel/**'
      - 'app/tsconfig.json'
      - 'scripts/lint-kernel-purity.ts'
      - 'scripts/kernel-api-surface.ts'
      - 'scripts/kernel-allowed-deps.json'
      - 'scripts/codemod-core-imports.ts'
      - '.github/workflows/kernel-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel:
    name: Kernel (typecheck / test / build / gates)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache app node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Package typecheck
        working-directory: packages/kernel
        run: bun run typecheck

      - name: Package tests
        working-directory: packages/kernel
        run: bun run test

      - name: Package build (standalone bundle)
        working-directory: packages/kernel
        run: bun run build

      # 产物可用性冒烟：只「构建成功」不等于「能 import」，更不等于「发布后子路径可用」。
      # 2026-10-24 实证：`exports` 一度指向 `dist/core/*.js`，而当时的 build 只产 `dist/index.js`
      # ⇒ 包能打出来、桶能 import，但**所有公开子路径在发布后都是 404**。
      # 故此处逐条断言 exports 的非通配目标**文件真实存在**，并抽查桶与一个子路径可 import。
      - name: Build artifact smoke (barrel + every published subpath)
        working-directory: packages/kernel
        run: |
          bun -e "
          const fs = await import('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const m = await import('./dist/index.js');
          const need = ['KERNEL_PACKAGE_NAME', 'feature', 'resolveDbPath', 'AppError', 'globalEventBus'];
          const miss = need.filter((k) => m[k] === undefined);
          if (miss.length) { console.error('桶面缺失导出: ' + miss.join(', ')); process.exit(1); }
          let checked = 0;
          for (const [key, val] of Object.entries(pkg.exports)) {
            if (key === '.') continue;
            const targets = typeof val === 'string' ? [val] : [val.types, val.import].filter(Boolean);
            for (const t of targets) {
              if (t.includes('*')) continue;            // 通配条目在下面单独抽查
              if (!fs.existsSync(t)) { console.error('exports 目标不存在: ' + key + ' -> ' + t); process.exit(1); }
              checked++;
            }
          }
          for (const [key, val] of Object.entries(pkg.exports)) {
            const t = typeof val === 'string' ? val : val.import;
            if (!t || !t.includes('*')) continue;
            const dir = t.slice(0, t.indexOf('*'));
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => f.endsWith('.js')) : [];
            if (files.length === 0) { console.error('通配导出无产物: ' + key + ' -> ' + dir); process.exit(1); }
          }
          await import('./dist/core/paths.js');          // 子路径产物真的可 import
          console.log('dist 可 import；exports 目标全部存在（' + checked + ' 个文件）；子路径可 import');
          "

      # 内核纯净度：K01–K04 跨层 / K06 依赖白名单 / K07 深路径棘轮（均可独立于 app 全量执行）
      - name: Kernel purity gate (K01-K07)
        run: bun run scripts/lint-kernel-purity.ts

      # 导出面快照：未评审的破坏性 API 变更直接失败
      - name: Kernel API surface snapshot
        run: bun run scripts/kernel-api-surface.ts --check

      # 旧别名回流检查（`@modules/core` 已统一为 `@openliri/kernel`）
      - name: Forbidden legacy alias
        run: bun run scripts/codemod-core-imports.ts --check

      # app 侧的内核集成回路（tests/core + tests/execution + 事件日志一族）
      - name: Kernel loop (app-side integration)
        working-directory: app
        run: bun run test:kernel
