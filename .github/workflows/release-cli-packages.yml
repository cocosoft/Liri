name: Release CLI Packages

# G2 剩余（2026-11-14）：npm / Scoop / Homebrew 分发。
# 与 `release.yml`（Tauri 桌面安装包）并行、互不依赖；仅在发版 tag 运行。
#
# 产物：
#   1. `liri-cli-<version>.tgz`（含 `dist/main.js` + `Liri.cmd`）→ GitHub Release 资产
#   2. 三份渠道清单（`packaging/**`，由脚本按真实 sha256 重新生成）→ 工作流 artifact
#   3. npm 发布（仅当配置 `NPM_TOKEN`；否则跳过并留日志）
#   4. **三平台单文件二进制**（G2 三期：win/mac/linux 矩阵原生构建 + 可选签名 + `SHA256SUMS`）
#
# 如实边界：Scoop bucket / Homebrew tap 的 PR 仍需人工提交；本工作流只产出可直接提交的清单。
# 签名证书/凭据来自仓库 secrets，**未配置即如实跳过**（不伪造已签名）。

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: Package CLI (npm / scoop / brew)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI bundle
        run: bun run build

      - name: Stage artifact
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="liri-cli-${VERSION}"
          mkdir -p "release/${STAGE}/dist"
          cp dist/main.js "release/${STAGE}/dist/main.js"
          # Windows 启动器（Scoop manifest 的 bin 指向它；内容只用 bun 跑 dist/main.js）
          printf '@echo off\r\nbun "%%~dp0dist\\main.js" %%*\r\n' > "release/${STAGE}/Liri.cmd"
          tar -czf "release/${STAGE}.tgz" -C release "${STAGE}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Generate manifests (真实 sha256)
        run: |
          bun run ../scripts/gen-package-manifests.ts \
            --version "$VERSION" \
            --artifact "release/liri-cli-${VERSION}.tgz" \
            --download-base "https://github.com/${{ github.repository }}/releases/download"

      # 2026-11-19（npm 替代分发）：不依赖 `NPM_TOKEN` 也产出**可直接安装**的 tarball —
      # 拿到的人 `npm i -g ./openliri-bun-<ver>.tgz` 即可（需本机有 Bun），或人工 `npm publish`。
      - name: Pack npm tarball (no token required)
        run: |
          set -euo pipefail
          mkdir -p ../packaging/npm/dist ../release/npm
          cp dist/main.js ../packaging/npm/dist/main.js
          # 必须写 `./` 前缀：`npm pack packaging/npm` 会被当成 GitHub 简写（owner/repo）去 ls-remote
          npm pack ./../packaging/npm --pack-destination "$GITHUB_WORKSPACE/release/npm"
          ls -l "$GITHUB_WORKSPACE/release/npm"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liri-cli-${{ env.VERSION }}
          path: |
            app/release/liri-cli-${{ env.VERSION }}.tgz
            release/npm/*.tgz
            packaging/npm/package.json
            packaging/scoop/liri.json
            packaging/homebrew/liri.rb

      # 2026-11-19（竞态修复）：原 `gh release upload … || echo` 在 release.yml 尚未建 Release 时
      # **静默落到"仅 artifact"**（真机 run#3 日志 `release not found`，20 个 release 无一个 CLI 附件）。
      # 改用与本仓 release.yml 同一个 `softprops/action-gh-release@v2`：**不存在则创建、存在则追加**，
      # 两个工作流并发也不会互踩（不再依赖"谁先跑完"）。
      - name: Attach archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            app/release/liri-cli-${{ env.VERSION }}.tgz
            release/npm/*.tgz
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Publish to npm (optional)
        # 未配置 `NPM_TOKEN` ⇒ 步骤内自行跳过（step `if` 无法读 secrets 值）
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "⚠️ 未配置 NPM_TOKEN ⇒ 跳过 npm 发布（tarball 已挂 GitHub Release，可离线安装/人工 publish）"
            exit 0
          fi
          mkdir -p packaging/npm/dist
          cp dist/main.js packaging/npm/dist/main.js
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          npm publish packaging/npm --access public

  # G2 剩余三期（2026-11-14）：三平台单文件二进制。
  # `bun build --compile` 只能产出**当前平台**产物 ⇒ 用矩阵在各自 OS 原生构建。
  # 签名凭据来自 secrets：未配置时 `sign-cli-binary.ts` 打印跳过原因并继续（产物为未签名）。
  cli-binaries:
    name: CLI binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build single-file binary
        run: bun run scripts/build-cli-binary.ts

      # G2 七期（2026-11-14）：macOS runner 是 arm64，原生只有 darwin-arm64；
      # Homebrew / npm 分包还需要 darwin-x64 ⇒ 用 Bun 交叉编译补这一份（SHA256SUMS 会合并）。
      - name: Build cross-target binary (macOS Intel)
        if: runner.os == 'macOS'
        run: bun run scripts/build-cli-binary.ts --target=bun-darwin-x64

      - name: Sign (optional; 未配置证书 ⇒ 如实跳过并重算 SHA256SUMS)
        env:
          LIRI_SIGN_WIN_CERT_PFX_BASE64: ${{ secrets.LIRI_SIGN_WIN_CERT_PFX_BASE64 }}
          LIRI_SIGN_WIN_CERT_PASSWORD: ${{ secrets.LIRI_SIGN_WIN_CERT_PASSWORD }}
          LIRI_SIGN_MAC_IDENTITY: ${{ secrets.LIRI_SIGN_MAC_IDENTITY }}
          LIRI_SIGN_MAC_CERT_P12_BASE64: ${{ secrets.LIRI_SIGN_MAC_CERT_P12_BASE64 }}
          LIRI_SIGN_MAC_CERT_PASSWORD: ${{ secrets.LIRI_SIGN_MAC_CERT_PASSWORD }}
        run: bun run scripts/sign-cli-binary.ts

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: liri-cli-bin-${{ matrix.os }}
          path: app/dist/cli-bin/*

      # 2026-11-19（竞态修复）：同 package 作业 —— 交由 action 负责"建或追加"，不再静默丢产物。
      - name: Attach binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: app/dist/cli-bin/*
          overwrite_files: true
          fail_on_unmatched_files: true

  # G2 剩余四期（2026-11-14）：standalone 清单（去 bun 前置）。
  # 只有矩阵产物**齐全**才出清单：`gen-package-manifests.ts --standalone` 缺平台即退出 1。
  # 合并后的 `SHA256SUMS` 覆盖各作业单独那份（后者只是构建期自检）。
  standalone-manifests:
    name: Standalone manifests (去 bun 前置)
    needs: [cli-binaries]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: liri-cli-bin-*
          path: cli-bin
          merge-multiple: true

      - name: Render standalone manifests (真实 sha256)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bun run scripts/gen-package-manifests.ts \
            --standalone \
            --version "$VERSION" \
            --assets cli-bin \
            --download-base "https://github.com/${{ github.repository }}/releases/download"

      - name: Upload standalone manifests
        uses: actions/upload-artifact@v4
        with:
          name: liri-standalone-manifests
          path: packaging/standalone/**

      # 2026-11-19（竞态修复）：同 package 作业。
      - name: Attach manifests to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            packaging/standalone/SHA256SUMS
            packaging/standalone/scoop/liri.json
            packaging/standalone/homebrew/liri.rb
          overwrite_files: true
          fail_on_unmatched_files: true

  # G2 剩余五期（2026-11-14）：npm standalone（按平台分包，去 bun 前置）。
  # 发布顺序：先平台包 `@openliri/cli-*`，再主包 `openliri`（主包 optionalDependencies 指向它们）。
  npm-standalone:
    name: npm standalone packages (去 bun 前置)
    needs: [cli-binaries]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: liri-cli-bin-*
          path: cli-bin
          merge-multiple: true

      - name: Render npm package tree (真实二进制就位)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          bun run scripts/gen-package-manifests.ts \
            --standalone-npm \
            --version "$VERSION" \
            --assets cli-bin

      # 2026-11-19（npm 替代分发）：把主包 + 各平台包打成 tarball 挂 Release —— 无需 `NPM_TOKEN`，
      # 用户可 `npm i -g ./openliri-<ver>.tgz`（含平台 `@openliri/cli-*` 的 tarball 一起提供）。
      - name: Pack standalone npm tarballs (no token required)
        run: |
          set -euo pipefail
          mkdir -p release/npm-standalone
          # `./` 前缀不可省：裸 `packaging/xxx` 会被 npm 当成 GitHub 简写（owner/repo）
          npm pack ./packaging/standalone-npm --pack-destination "$PWD/release/npm-standalone"
          for d in ./packaging/standalone-npm/packages/@openliri/*/; do
            npm pack "$d" --pack-destination "$PWD/release/npm-standalone"
          done
          ls -l release/npm-standalone

      - name: Upload npm packages
        uses: actions/upload-artifact@v4
        with:
          name: liri-npm-standalone
          path: |
            packaging/standalone-npm/**
            release/npm-standalone/*.tgz

      - name: Attach npm tarballs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/npm-standalone/*.tgz
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Publish to npm (optional)
        # 未配置 `NPM_TOKEN` ⇒ 步骤内自行跳过（step `if` 无法读 secrets 值）
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "⚠️ 未配置 NPM_TOKEN ⇒ 跳过 npm 发布（tarball 已挂 GitHub Release，可离线安装/人工 publish）"
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          for dir in packaging/standalone-npm/packages/@openliri/*/; do
            npm publish "$dir" --access public
          done
          npm publish packaging/standalone-npm --access public
