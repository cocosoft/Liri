name: Release Cross-Platform

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════
  # Lint & Test（所有 push/PR 均运行）
  # ══════════════════════════════════════════════
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test
        continue-on-error: true

  # ══════════════════════════════════════════════
  # JS Bundle（平台无关，供 Tauri sidecar 使用）
  # ══════════════════════════════════════════════
  bundle:
    needs: lint-test
    name: Bundle JS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Bundle JS
        run: bun build --target=bun --packages=external src/main.ts --outdir=dist

      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: app/dist/

  # ══════════════════════════════════════════════
  # 独立可执行文件（Standalone exe）
  # 产物命名规则：liri_terminal-{variant}-{platform}-v{version}.tar.gz
  # ══════════════════════════════════════════════
  standalone-exe:
    name: Standalone (${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: app

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: coding-win-x64
            variant: coding
            os: windows-latest
            bun-target: bun-windows-x64-modern
            ext: .exe
            platform: windows-x64

          - display: coding-mac-arm64
            variant: coding
            os: macos-latest
            bun-target: bun-darwin-arm64-modern
            ext: ""
            platform: macos-arm64

          - display: coding-linux-x64
            variant: coding
            os: ubuntu-latest
            bun-target: bun-linux-x64-modern
            ext: ""
            platform: linux-x64

          - display: personal-win-x64
            variant: personal
            os: windows-latest
            bun-target: bun-windows-x64-modern
            ext: .exe
            platform: windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Generate variant feature flags
        run: bun run scripts/build-variant.ts --variant=${{ matrix.variant }}

      - name: Get version tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build standalone executable
        run: >
          bun build --compile
          --target=${{ matrix.bun-target }}
          --external=pdfjs-dist
          --external=sharp
          --outfile=../dist/liri_terminal-${{ matrix.variant }}-${{ matrix.platform }}-v${{ steps.version.outputs.version }}${{ matrix.ext }}
          src/pyapp.ts

      - name: Copy external dependencies
        run: bun run scripts/copy-external-deps.ts

      - name: Package release archive
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          BASE="liri_terminal-${{ matrix.variant }}-${{ matrix.platform }}"
          RELEASE_NAME="${BASE}-v${VER}"
          RELEASE_DIR="../dist/release/${RELEASE_NAME}"

          mkdir -p "${RELEASE_DIR}"

          cp "../dist/${BASE}-v${VER}${{ matrix.ext }}" "${RELEASE_DIR}/"

          # 复制外部依赖（copy-external-deps 输出到 dist/deps/）
          if [ -d "../dist/deps" ]; then
            cp -r "../dist/deps" "${RELEASE_DIR}/deps"
          else
            echo "WARNING: dist/deps/ not found, binary may fail to load sharp/pdfjs-dist"
          fi

          # 复制运行配置（只读资源）
          if [ -d "config" ]; then
            cp -r "config" "${RELEASE_DIR}/config"
          fi
          cp ".env.example" "${RELEASE_DIR}/" 2>/dev/null || true

          # 复制文档
          if [ -d "docs" ]; then
            cp -r "docs" "${RELEASE_DIR}/docs"
          fi
          cp "../docs/README-compiled.md" "${RELEASE_DIR}/" 2>/dev/null || true

          cd ../dist/release
          tar czf "${RELEASE_NAME}.tar.gz" "${RELEASE_NAME}"

          echo "Package contents:"
          find "${RELEASE_NAME}" -type f | sort
          echo ""
          echo "Packaged: ${RELEASE_NAME}.tar.gz"

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.variant }}-${{ matrix.platform }}
          path: dist/release/liri_terminal-${{ matrix.variant }}-${{ matrix.platform }}-v${{ steps.version.outputs.version }}.tar.gz

  # ══════════════════════════════════════════════
  # 便携 Bun + Bundle 完整包（方案 C）
  # 产物：liri-v{version}-{platform}-full.zip + update.zip
  # ══════════════════════════════════════════════
  portable-bundle:
    name: Portable Bundle (${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: app

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: win-x64
            os: windows-latest
            bun-target: bun-windows-x64-modern
            platform: win-x64
            ext: .exe

          - display: macos-arm64
            os: macos-latest
            bun-target: bun-darwin-arm64-modern
            platform: macos-arm64
            ext: ""

          - display: linux-x64
            os: ubuntu-latest
            bun-target: bun-linux-x64-modern
            platform: linux-x64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 阶段 1：变体构建
      - name: Generate variant
        run: bun run scripts/build-variant.ts --variant=personal

      # 阶段 2：打包业务代码
      - name: Build bundle
        run: bun run build:bundle

      # 阶段 3：复制运行时
      - name: Setup runtime
        run: bun run build:runtime

      # 阶段 4：复制原生依赖
      - name: Copy native deps
        run: bun run build:deps

      # 阶段 5：复制种子数据
      - name: Copy seed data
        run: bun run build:seed

      # 阶段 6：生成启动脚本
      - name: Generate launcher
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            printf '@echo off\r\nsetlocal\r\nset "LIRI_PROJECT_DIR=%%~dp0"\r\n"%%~dp0runtime\\bun.exe" run "%%~dp0liri.js" %%*\r\n' > ../dist/pkg/run.bat
          else
            printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport LIRI_PROJECT_DIR="$DIR"\n"$DIR/runtime/bun" run "$DIR/liri.js" "$@"\n' > ../dist/pkg/run.sh
            chmod +x ../dist/pkg/run.sh
          fi

      # 阶段 7：打包完整包
      - name: Package full zip
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          cd ../dist
          ZIP_NAME="liri-v${VER}-${{ matrix.platform }}-full.zip"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell Compress-Archive -Path pkg\* -DestinationPath "${ZIP_NAME}" -Force
          else
            cd pkg && zip -r "../${ZIP_NAME}" . && cd ..
          fi

          echo "Full package: ${ZIP_NAME} ($(du -h ${ZIP_NAME} 2>/dev/null | cut -f1 || echo 'unknown'))"

      # 阶段 8：增量包
      - name: Package update zip
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          mkdir -p ../dist/update-tmp
          cp ../dist/pkg/liri.js ../dist/update-tmp/
          if [ -d "../dist/pkg/node_modules" ]; then
            mkdir -p ../dist/update-tmp/deps/node_modules
            for dep in sharp pdfjs-dist; do
              if [ -d "../dist/pkg/node_modules/$dep" ]; then
                cp -r "../dist/pkg/node_modules/$dep" ../dist/update-tmp/deps/node_modules/
              fi
            done
          fi
          cd ../dist
          ZIP_NAME="liri-v${VER}-update.zip"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell Compress-Archive -Path update-tmp\* -DestinationPath "${ZIP_NAME}" -Force
          else
            cd update-tmp && zip -r "../${ZIP_NAME}" . && cd ..
          fi
          rm -rf update-tmp
          echo "Update package: ${ZIP_NAME}"

      # 校验和
      - name: Generate checksum
        shell: bash
        run: |
          cd ../dist
          for f in liri-*.zip; do
            sha256sum "$f" >> checksums.txt
          done

      # 包体积监控
      - name: Check package size
        shell: bash
        run: |
          MAX_SIZE_MB=120
          for f in ../dist/liri-*-full.zip; do
            SIZE_MB=$(du -m "$f" 2>/dev/null | cut -f1 || echo "0")
            echo "Package: $(basename $f) = ${SIZE_MB} MB"
            if [ "${SIZE_MB}" -gt "${MAX_SIZE_MB}" ] 2>/dev/null; then
              echo "WARNING: Package size ${SIZE_MB}MB exceeds limit ${MAX_SIZE_MB}MB"
            fi
          done
          echo "Size check complete"

      # 构建产物验证
      - name: Verify package
        shell: bash
        run: |
          echo "=== Verifying package structure ==="
          PKG_DIR="../dist/pkg"
          for f in "liri.js"; do
            if [ -f "$PKG_DIR/$f" ]; then echo "  ✅ $f"; else echo "  ❌ $f MISSING"; fi
          done
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            if [ -f "$PKG_DIR/run.bat" ]; then echo "  ✅ run.bat"; else echo "  ❌ run.bat MISSING"; fi
          else
            if [ -f "$PKG_DIR/run.sh" ]; then echo "  ✅ run.sh"; else echo "  ❌ run.sh MISSING"; fi
          fi
          if [ -d "$PKG_DIR/runtime" ]; then echo "  ✅ runtime/"; fi
          if [ -d "$PKG_DIR/node_modules/sharp" ]; then echo "  ✅ deps/sharp"; fi
          if [ -d "$PKG_DIR/app" ]; then echo "  ✅ app/ (seed data)"; fi
          echo "=== Verification passed ==="

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: |
            dist/liri-*.zip
            dist/checksums.txt
          retention-days: 30

  # ══════════════════════════════════════════════
  # Tauri 桌面客户端（嵌入 sidecar）
  # ══════════════════════════════════════════════
  tauri-build:
    name: Build Tauri Client (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            sidecar-build: build:win:coding
            sidecar-ext: .exe

          - name: macOS (ARM)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            sidecar-build: build:mac
            sidecar-ext: ""

          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb
            sidecar-build: build:linux
            sidecar-ext: ""

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            client/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-tauri-${{ hashFiles('client/src-tauri/Cargo.lock', 'client/src-tauri/tauri.conf.json') }}

      - name: Download JS dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: app/dist

      - name: Install system dependencies (Linux)
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install client dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            bun install --frozen-lockfile && break || {
              if [ $attempt -lt 3 ]; then
                echo "Install failed, clearing cache and retrying..."
                bun pm cache rm
                sleep 5
              else
                echo "Final attempt failed"
                exit 1
              fi
            }
          done

      - name: Build sidecar (${{ matrix.config.name }})
        working-directory: ${{ github.workspace }}/app
        shell: bash
        run: |
          set -euo pipefail

          echo "=== [0] Installing dependencies with retry ==="
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            bun install --frozen-lockfile && break || {
              if [ $attempt -lt 3 ]; then
                echo "Install failed, clearing cache and retrying..."
                bun pm cache rm
                sleep 5
              else
                echo "Final attempt failed"
                exit 1
              fi
            }
          done

          echo "=== [1] Check for downloaded dist bundle ==="
          if [ -d dist ] && [ "$(ls -A dist 2>/dev/null || true)" ]; then
            echo "Using downloaded JS bundle in dist/"
          else
            echo "No downloaded dist found; building JS bundle locally"
            bun build --target=bun --packages=external src/main.ts --outdir=dist
          fi

          echo "=== [2] Building sidecar binary ==="
          echo "Running: bun run ${{ matrix.config.sidecar-build }}"

          # 捕获完整输出（stdout+stderr），失败时展示以辅助排查
          BUILD_OUTPUT=$(bun run ${{ matrix.config.sidecar-build }} 2>&1) || {
            BUILD_EXIT=$?
            echo "ERROR: Sidecar build command failed with exit code $BUILD_EXIT"
            echo "Build output:"
            echo "$BUILD_OUTPUT"
            echo "=== Checking ../dist contents ==="
            ls -lah ../dist/ 2>/dev/null || echo "../dist/ does not exist"
            echo "=== Checking app/dist contents ==="
            ls -lah dist/ 2>/dev/null || true
            exit 1
          }

          echo "Build output:"
          echo "$BUILD_OUTPUT"

          echo "=== [3] Verifying build artifacts ==="
          echo "=== Contents of ../dist after sidecar build ==="
          ls -lah ../dist/ || true
          echo "=== Contents of dist/ (JS bundle) ==="
          ls -lah dist/ || true

          # 验证 sidecar 二进制是否存在（停留在 app/ 目录内，不 cd 进 ../dist）
          if ! ls ../dist/liri_terminal* 1> /dev/null 2>&1; then
            echo "ERROR: no liri_terminal* file found in ../dist after sidecar build"
            echo "Directory contents:"
            ls -la ../dist/
            exit 1
          fi

          SIDEFILE=$(ls ../dist | grep -E '^liri_terminal' | head -n1)
          echo "Found sidecar binary: $SIDEFILE ($(du -sh "../dist/$SIDEFILE" | cut -f1))"

          # 归一化 sidecar 产物名称为 liri_terminal，供下游 copy 步骤使用
          if [ "$SIDEFILE" != "liri_terminal${{ matrix.config.sidecar-ext }}" ]; then
            echo "Renaming $SIDEFILE -> liri_terminal${{ matrix.config.sidecar-ext }}"
            mv "../dist/$SIDEFILE" "../dist/liri_terminal${{ matrix.config.sidecar-ext }}"
          fi

          echo "Sidecar build completed successfully."

      - name: Verify sidecar artifact
        run: |
          echo "=== ../dist ==="
          ls -la ../dist || true
          echo "=== ../app/node_modules ==="
          ls -la ../app/node_modules || true
        shell: bash

      - name: Copy sidecar to Tauri binaries dir
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          # 匹配 sidecar 输出：liri_terminal*
          # 注意：-Include 配合 -Path 目录时必须在路径末尾加 \*，否则不生效
          $side = Get-ChildItem -Path "../dist/*" -Include "liri_terminal*" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $side) {
            Write-Error "ERROR: sidecar binary not found in ../dist"
            Write-Host "=== ../dist contents for debugging ==="
            Get-ChildItem ../dist -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Copying sidecar: $($side.Name) -> src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"
          Copy-Item $side.FullName "src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}" -Force

          # 只复制运行时必需的 2 个原生模块（sharp + pdfjs-dist），不复制全部 480+ 包
          # pyapp.ts 的 Module._resolveFilename hook 在 exeDir/deps/node_modules/ 查找
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/deps/node_modules
          if (Test-Path ../dist/deps/node_modules) {
            Get-ChildItem -Path ../dist/deps/node_modules -Force | Copy-Item -Destination src-tauri/binaries/deps/node_modules -Recurse -Force
          } else {
            Write-Warning "dist/deps/node_modules not found, copying from app/node_modules (sharp + pdfjs-dist only)"
            foreach ($pkg in @('sharp', 'pdfjs-dist')) {
              $src = "../app/node_modules/$pkg"
              if (Test-Path $src) {
                Copy-Item -Path $src -Destination "src-tauri/binaries/deps/node_modules/$pkg" -Recurse -Force
              } else {
                Write-Error "ERROR: required native module '$pkg' not found at $src"
                exit 1
              }
            }
          }
          Write-Host "=== binaries/deps/node_modules contents ==="
          Get-ChildItem src-tauri/binaries/deps/node_modules -Directory | Select-Object Name
        shell: powershell
        if: matrix.config.os == 'windows-latest'

      - name: Copy sidecar to Tauri binaries dir (Unix)
        run: |
          mkdir -p src-tauri/binaries
          # 匹配 sidecar 输出
          SIDEFILE=$(ls ../dist | grep -E '^liri_terminal' | head -n1 || true)
          if [ -z "$SIDEFILE" ]; then
            echo "ERROR: sidecar binary not found in ../dist"
            echo "Listing ../dist for debugging:"
            ls -la ../dist || true
            exit 1
          fi
          echo "Copying sidecar from ../dist/${SIDEFILE} -> src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"
          cp "../dist/${SIDEFILE}" "src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"

          # 只复制运行时必需的 2 个原生模块（sharp + pdfjs-dist），不复制全部 480+ 包
          # pyapp.ts 的 Module._resolveFilename hook 在 exeDir/deps/node_modules/ 查找
          mkdir -p src-tauri/binaries/deps/node_modules
          if [ -d ../dist/deps/node_modules ]; then
            cp -a ../dist/deps/node_modules/. src-tauri/binaries/deps/node_modules/
          else
            echo "WARNING: dist/deps/node_modules not found, copying from app/node_modules (sharp + pdfjs-dist only)"
            for pkg in sharp pdfjs-dist; do
              if [ -d "../app/node_modules/$pkg" ]; then
                cp -a "../app/node_modules/$pkg/." "src-tauri/binaries/deps/node_modules/$pkg/"
              else
                echo "ERROR: required native module '$pkg' not found at ../app/node_modules/$pkg"
                exit 1
              fi
            done
          fi
          echo "=== binaries/deps/node_modules contents ==="
          ls -d src-tauri/binaries/deps/node_modules/*/ 2>/dev/null || true
        shell: bash
        if: matrix.config.os != 'windows-latest'

      - name: Build Tauri app
        run: bun run tauri build --bundles ${{ matrix.config.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer-${{ matrix.config.name }}
          path: |
            client/src-tauri/target/release/bundle/

  # ══════════════════════════════════════════════
  # GitHub Release
  # ══════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [bundle, standalone-exe, portable-bundle, tauri-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Download all Tauri installers
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-installer-*
          path: installers
          merge-multiple: true

      - name: Download all standalone executables
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: standalone
          merge-multiple: true

      - name: Download all portable bundles
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: portable
          merge-multiple: true

      - name: List release assets
        run: |
          echo "=== Dist bundle ==="
          ls -la dist/ || true
          echo ""
          echo "=== Tauri installers ==="
          find installers/ -type f | sort || true
          echo ""
          echo "=== Standalone executables ==="
          find standalone/ -type f | sort || true
          echo ""
          echo "=== Portable bundles ==="
          find portable/ -type f | sort || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/main.js
            installers/**/*.msi
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
            standalone/**/*.tar.gz
            portable/**/*.zip
            portable/**/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
