name: Release Cross-Platform

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════
  # JS Bundle（平台无关，供 Tauri sidecar 使用）
  # ══════════════════════════════════════════════
  bundle:
    name: Bundle JS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Bundle JS
        run: bun build --target=bun --packages=external src/main.ts --outdir=dist

      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: app/dist/

  # ══════════════════════════════════════════════
  # 独立可执行文件（Standalone exe）
  # 产物命名规则：py_app-{variant}-{platform}-v{version}.tar.gz
  # ══════════════════════════════════════════════
  standalone-exe:
    name: Standalone (${{ matrix.display }})
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: app

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: coding-win-x64
            variant: coding
            os: windows-latest
            bun-target: bun-windows-x64-modern
            ext: .exe
            platform: windows-x64

          - display: coding-mac-arm64
            variant: coding
            os: macos-latest
            bun-target: bun-darwin-arm64-modern
            ext: ""
            platform: macos-arm64

          - display: coding-linux-x64
            variant: coding
            os: ubuntu-latest
            bun-target: bun-linux-x64-modern
            ext: ""
            platform: linux-x64

          - display: personal-win-x64
            variant: personal
            os: windows-latest
            bun-target: bun-windows-x64-modern
            ext: .exe
            platform: windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Generate variant feature flags
        run: bun run scripts/build-variant.ts --variant=${{ matrix.variant }}

      - name: Get version tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build standalone executable
        run: >
          bun build --compile
          --target=${{ matrix.bun-target }}
          --external=pdfjs-dist
          --external=sharp
          --outfile=../dist/py_app-${{ matrix.variant }}-${{ matrix.platform }}-v${{ steps.version.outputs.version }}${{ matrix.ext }}
          src/pyapp.ts

      - name: Copy external dependencies
        run: bun run scripts/copy-external-deps.ts

      - name: Package release archive
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          BASE="py_app-${{ matrix.variant }}-${{ matrix.platform }}"
          RELEASE_NAME="${BASE}-v${VER}"
          RELEASE_DIR="../dist/release/${RELEASE_NAME}"

          mkdir -p "${RELEASE_DIR}"

          cp "../dist/${BASE}-v${VER}${{ matrix.ext }}" "${RELEASE_DIR}/"

          if [ -d "../dist/node_modules" ]; then
            cp -r "../dist/node_modules" "${RELEASE_DIR}/node_modules"
          fi

          cp "../docs/README-compiled.md" "${RELEASE_DIR}/" 2>/dev/null || true

          cd ../dist/release
          tar czf "${RELEASE_NAME}.tar.gz" "${RELEASE_NAME}"

          echo "Packaged: ${RELEASE_NAME}.tar.gz"

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.variant }}-${{ matrix.platform }}
          path: dist/release/py_app-${{ matrix.variant }}-${{ matrix.platform }}-v${{ steps.version.outputs.version }}.tar.gz

  # ══════════════════════════════════════════════
  # Tauri 桌面客户端（嵌入 sidecar）
  # ══════════════════════════════════════════════
  tauri-build:
    name: Build Tauri Client (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    needs: bundle

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            sidecar-build: build:win:coding
            sidecar-ext: .exe

          - name: macOS (ARM)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            sidecar-build: build:mac
            sidecar-ext: ""

          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb
            sidecar-build: build:linux
            sidecar-ext: ""

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            client/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-tauri-${{ hashFiles('client/src-tauri/Cargo.lock', 'client/src-tauri/tauri.conf.json') }}

      - name: Download JS dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: app/dist

      - name: Install system dependencies (Linux)
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install client dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            bun install --frozen-lockfile && break || {
              if [ $attempt -lt 3 ]; then
                echo "Install failed, clearing cache and retrying..."
                bun pm cache rm
                sleep 5
              else
                echo "Final attempt failed"
                exit 1
              fi
            }
          done

      - name: Build sidecar (${{ matrix.config.name }})
        working-directory: ${{ github.workspace }}/app
        shell: bash
        run: |
          set -euo pipefail

          echo "=== [0] Installing dependencies with retry ==="
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            bun install --frozen-lockfile && break || {
              if [ $attempt -lt 3 ]; then
                echo "Install failed, clearing cache and retrying..."
                bun pm cache rm
                sleep 5
              else
                echo "Final attempt failed"
                exit 1
              fi
            }
          done

          echo "=== [1] Check for downloaded dist bundle ==="
          if [ -d dist ] && [ "$(ls -A dist 2>/dev/null || true)" ]; then
            echo "Using downloaded JS bundle in dist/"
          else
            echo "No downloaded dist found; building JS bundle locally"
            bun build --target=bun --packages=external src/main.ts --outdir=dist
          fi

          echo "=== [2] Building sidecar binary ==="
          echo "Running: bun run ${{ matrix.config.sidecar-build }}"

          # 捕获完整输出（stdout+stderr），失败时展示以辅助排查
          BUILD_OUTPUT=$(bun run ${{ matrix.config.sidecar-build }} 2>&1) || {
            BUILD_EXIT=$?
            echo "ERROR: Sidecar build command failed with exit code $BUILD_EXIT"
            echo "Build output:"
            echo "$BUILD_OUTPUT"
            echo "=== Checking ../dist contents ==="
            ls -lah ../dist/ 2>/dev/null || echo "../dist/ does not exist"
            echo "=== Checking app/dist contents ==="
            ls -lah dist/ 2>/dev/null || true
            exit 1
          }

          echo "Build output:"
          echo "$BUILD_OUTPUT"

          echo "=== [3] Verifying build artifacts ==="
          echo "=== Contents of ../dist after sidecar build ==="
          ls -lah ../dist/ || true
          echo "=== Contents of dist/ (JS bundle) ==="
          ls -lah dist/ || true

          # 验证 sidecar 二进制是否存在（停留在 app/ 目录内，不 cd 进 ../dist）
          if ! ls ../dist/liri_coding* 1> /dev/null 2>&1; then
            echo "ERROR: no liri_coding* file found in ../dist after sidecar build"
            echo "Directory contents:"
            ls -la ../dist/
            exit 1
          fi

          SIDEFILE=$(ls ../dist | grep -E '^liri_coding' | head -n1)
          echo "Found sidecar binary: $SIDEFILE ($(du -sh "../dist/$SIDEFILE" | cut -f1))"

          # 归一化 sidecar 产物名称为 liri_coding，供下游 copy 步骤使用
          if [ "$SIDEFILE" != "liri_coding${{ matrix.config.sidecar-ext }}" ]; then
            echo "Renaming $SIDEFILE -> liri_coding${{ matrix.config.sidecar-ext }}"
            mv "../dist/$SIDEFILE" "../dist/liri_coding${{ matrix.config.sidecar-ext }}"
          fi

          echo "Sidecar build completed successfully."

      - name: Verify sidecar artifact
        run: |
          echo "=== ../dist ==="
          ls -la ../dist || true
          echo "=== ../app/node_modules ==="
          ls -la ../app/node_modules || true
        shell: bash

      - name: Copy sidecar to Tauri binaries dir
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          # 灵活匹配多种可能的输出名：liri_coding*, py_app*, py_app-*
          # 注意：-Include 配合 -Path 目录时必须在路径末尾加 \*，否则不生效
          $side = Get-ChildItem -Path "../dist/*" -Include "liri_coding*","py_app*","py_app-*" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $side) {
            Write-Error "ERROR: sidecar binary not found in ../dist"
            Write-Host "=== ../dist contents for debugging ==="
            Get-ChildItem ../dist -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Copying sidecar: $($side.Name) -> src-tauri/binaries/liri_coding-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"
          Copy-Item $side.FullName "src-tauri/binaries/liri_coding-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}" -Force

          # 只复制运行时必需的 2 个原生模块（sharp + pdfjs-dist），不复制全部 480+ 包
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/node_modules
          if (Test-Path ../dist/node_modules) {
            Get-ChildItem -Path ../dist/node_modules -Force | Copy-Item -Destination src-tauri/binaries/node_modules -Recurse -Force
          } else {
            Write-Warning "dist/node_modules not found, copying from app/node_modules (sharp + pdfjs-dist only)"
            foreach ($pkg in @('sharp', 'pdfjs-dist')) {
              $src = "../app/node_modules/$pkg"
              if (Test-Path $src) {
                Copy-Item -Path $src -Destination "src-tauri/binaries/node_modules/$pkg" -Recurse -Force
              } else {
                Write-Error "ERROR: required native module '$pkg' not found at $src"
                exit 1
              }
            }
          }
          Write-Host "=== binaries/node_modules contents ==="
          Get-ChildItem src-tauri/binaries/node_modules -Directory | Select-Object Name
        shell: powershell
        if: matrix.config.os == 'windows-latest'

      - name: Copy sidecar to Tauri binaries dir (Unix)
        run: |
          mkdir -p src-tauri/binaries
          # 灵活匹配多种可能的输出名（优先：liri_coding*，回退：py_app*）
          SIDEFILE=$(ls ../dist | grep -E '^liri_coding|^py_app' | head -n1 || true)
          if [ -z "$SIDEFILE" ]; then
            echo "ERROR: sidecar binary not found in ../dist"
            echo "Listing ../dist for debugging:"
            ls -la ../dist || true
            exit 1
          fi
          echo "Copying sidecar from ../dist/${SIDEFILE} -> src-tauri/binaries/liri_coding-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"
          cp "../dist/${SIDEFILE}" "src-tauri/binaries/liri_coding-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"

          # 只复制运行时必需的 2 个原生模块（sharp + pdfjs-dist），不复制全部 480+ 包
          mkdir -p src-tauri/binaries/node_modules
          if [ -d ../dist/node_modules ]; then
            cp -a ../dist/node_modules/. src-tauri/binaries/node_modules/
          else
            echo "WARNING: dist/node_modules not found, copying from app/node_modules (sharp + pdfjs-dist only)"
            for pkg in sharp pdfjs-dist; do
              if [ -d "../app/node_modules/$pkg" ]; then
                cp -a "../app/node_modules/$pkg/." "src-tauri/binaries/node_modules/$pkg/"
              else
                echo "ERROR: required native module '$pkg' not found at ../app/node_modules/$pkg"
                exit 1
              fi
            done
          fi
          echo "=== binaries/node_modules contents ==="
          ls -d src-tauri/binaries/node_modules/*/ 2>/dev/null || true
        shell: bash
        if: matrix.config.os != 'windows-latest'

      - name: Build Tauri app
        run: bun run tauri build --bundles ${{ matrix.config.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer-${{ matrix.config.name }}
          path: |
            client/src-tauri/target/release/bundle/

  # ══════════════════════════════════════════════
  # GitHub Release
  # ══════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [bundle, standalone-exe, tauri-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Download all Tauri installers
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-installer-*
          path: installers
          merge-multiple: true

      - name: Download all standalone executables
        uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: standalone
          merge-multiple: true

      - name: List release assets
        run: |
          echo "=== Dist bundle ==="
          ls -la dist/ || true
          echo ""
          echo "=== Tauri installers ==="
          find installers/ -type f | sort || true
          echo ""
          echo "=== Standalone executables ==="
          find standalone/ -type f | sort || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/main.js
            installers/**/*.msi
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
            standalone/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
