name: Release Cross-Platform

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════
  # Lint & Test（所有 push/PR 均运行）
  # ══════════════════════════════════════════════
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test tests/
        # 版本门禁：测试失败必须阻断发版（2026-08-15 评审修正）
        # 统一到 tests/ 目录（1956 pass 全绿），src/ 预存失败另登记处理

  # ══════════════════════════════════════════════
  # 便携包（方案 C）：full zip（2026-09-10 单档收敛：退役 personal/pro 双档矩阵，全量构建）
  # 产物：liri-v{ver}-{platform}-full.zip（唯一 portable 产物；版本分层由运行时 tier 控制，见 featureFlags）
  # 依赖布局统一 node_modules/（与 pkg / exe 同级），校验交给 verify-package.ts（契约驱动）
  # ══════════════════════════════════════════════
  portable-bundle:
    name: Portable Bundle (${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: app

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: win-x64
            os: windows-latest
            platform: win-x64

          - display: macos-arm64
            os: macos-latest
            platform: macos-arm64

          - display: linux-x64
            os: ubuntu-latest
            platform: linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 阶段 1-5：统一脚本链（单档全量构建；版本分层由运行时 tier 控制）
      - name: Generate variant (full)
        run: bun run scripts/build-variant.ts --variant=full
      - name: Build bundle
        run: bun run build:bundle
      - name: Setup runtime
        run: bun run build:runtime
      - name: Copy native deps
        run: bun run build:deps
      - name: Copy seed data
        run: bun run build:seed

      # 阶段 6：启动脚本
      - name: Generate launcher
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            printf '@echo off\r\nsetlocal\r\nset "LIRI_PROJECT_DIR=%%~dp0"\r\n"%%~dp0runtime\\bun.exe" run "%%~dp0liri.js" %%*\r\n' > ../dist/pkg/run.bat
          else
            printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport LIRI_PROJECT_DIR="$DIR"\n"$DIR/runtime/bun" run "$DIR/liri.js" "$@"\n' > ../dist/pkg/run.sh
            chmod +x ../dist/pkg/run.sh
          fi

      # 阶段 7：契约校验（缺项即红；检查项来自 package-manifest.ts / 产物结构）
      - name: Verify package (contract)
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            EXTRA_ARGS="--file=run.bat"
          else
            EXTRA_ARGS="--file=run.sh"
          fi
          bun run scripts/verify-package.ts --pkg=../dist/pkg --dir=runtime --dir=app/config --dir=app/docs --file=app/data/pyapp/SOUL.md $EXTRA_ARGS

      # 阶段 8：full zip
      - name: Package full zip
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          cd ../dist
          # 命名契约（与 GitHubReleaseFetcher / smoke glob 一致）：liri-v{ver}-{platform}-full.zip
          # 单档收敛（2026-09-10）：无 edition 段；版本分层由运行时 tier 控制
          ZIP_NAME="liri-v${VER}-${{ matrix.platform }}-full.zip"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # 必须经 -Command 字符串让 PowerShell 自行展开 'pkg\*'：
            # bash 裸参 pkg\* 会被转义+glob 成目录 pkg，致 zip 条目带 pkg/ 前缀、
            # 解压后多一层目录（runtime/bun.exe → pkg/runtime/bun.exe），smoke 找不到运行时
            powershell -NoProfile -Command "Compress-Archive -Path 'pkg\*' -DestinationPath '${ZIP_NAME}' -Force"
          else
            cd pkg && zip -r "../${ZIP_NAME}" . && cd ..
          fi
          echo "Full package: ${ZIP_NAME}"


      # 阶段 9：校验和（按平台命名，由 release job 汇总为一份全量）
      - name: Generate checksum
        shell: bash
        run: |
          cd ../dist
          for f in liri-*.zip; do
            sha256sum "$f" >> checksums-${{ matrix.platform }}.txt
          done

      # 阶段 10：体积门禁（超限即失败；full 单产物设上限）
      - name: Check package size
        shell: bash
        run: |
          FAIL=0
          check_size() {
            local f="$1" max="$2"
            SIZE_MB=$(du -m "$f" 2>/dev/null | cut -f1 || echo "0")
            echo "Package: $(basename $f) = ${SIZE_MB} MB (limit ${max}MB)"
            if [ "${SIZE_MB}" -gt "${max}" ] 2>/dev/null; then
              echo "FAIL: $(basename $f) exceeds ${max}MB"
              FAIL=1
            fi
          }
          for f in ../dist/liri-*-full.zip; do check_size "$f" 120; done
          if [ "$FAIL" -ne 0 ]; then echo "=== Size check FAILED ==="; exit 1; fi
          echo "Size check passed"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: |
            dist/liri-*.zip
            dist/checksums-${{ matrix.platform }}.txt
          retention-days: 30

  # ══════════════════════════════════════════════
  # Tauri 桌面客户端（嵌入 compile sidecar；独立并行，不再依赖 JS bundle）
  # ══════════════════════════════════════════════
  tauri-build:
    name: Build Tauri Client (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            sidecar-build: build:win
            sidecar-ext: .exe

          - name: macOS-ARM
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            sidecar-build: build:mac
            sidecar-ext: ""

          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb
            sidecar-build: build:linux
            sidecar-ext: ""

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            client/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-tauri-${{ hashFiles('client/src-tauri/Cargo.lock', 'client/src-tauri/tauri.conf.json') }}

      - name: Install system dependencies (Linux)
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install client dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            bun install --frozen-lockfile && break || {
              if [ $attempt -lt 3 ]; then
                echo "Install failed, clearing cache and retrying..."
                bun pm cache rm
                sleep 5
              else
                echo "Final attempt failed"
                exit 1
              fi
            }
          done

      # 编译 sidecar（pyapp 单入口，统一 release-build 语义；产物落根 dist 供 tauri resources 整目录引用）
      - name: Build sidecar (${{ matrix.config.name }})
        working-directory: ${{ github.workspace }}/app
        shell: bash
        run: |
          set -euo pipefail
          echo "=== [0] Installing dependencies with retry ==="
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            bun install --frozen-lockfile && break || {
              if [ $attempt -lt 3 ]; then
                echo "Install failed, clearing cache and retrying..."
                bun pm cache rm
                sleep 5
              else
                echo "Final attempt failed"
                exit 1
              fi
            }
          done

          echo "=== [1] Building sidecar binary ==="
          BUILD_OUTPUT=$(bun run ${{ matrix.config.sidecar-build }} 2>&1) || {
            BUILD_EXIT=$?
            echo "ERROR: Sidecar build command failed with exit code $BUILD_EXIT"
            echo "$BUILD_OUTPUT"
            exit 1
          }

          if ! ls ../dist/liri_terminal* 1> /dev/null 2>&1; then
            echo "ERROR: no liri_terminal* file found in ../dist"
            ls -la ../dist/ || true
            exit 1
          fi

          SIDEFILE=$(ls ../dist | grep -E '^liri_terminal' | head -n1)
          echo "Found sidecar binary: $SIDEFILE"
          if [ "$SIDEFILE" != "liri_terminal${{ matrix.config.sidecar-ext }}" ]; then
            mv "../dist/$SIDEFILE" "../dist/liri_terminal${{ matrix.config.sidecar-ext }}"
          fi
          # compile 产物契约校验（node_modules 含全部 externals，缺项即红）
          bun run scripts/verify-package.ts --pkg=../dist

      - name: Copy sidecar to Tauri binaries dir
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          $side = Get-ChildItem -Path "../dist/*" -Include "liri_terminal*" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $side) {
            Write-Error "ERROR: sidecar binary not found in ../dist"
            exit 1
          }
          Write-Host "Copying sidecar: $($side.Name)"
          Copy-Item $side.FullName "src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}" -Force
        shell: powershell
        if: matrix.config.os == 'windows-latest'

      - name: Copy sidecar to Tauri binaries dir (Unix)
        run: |
          mkdir -p src-tauri/binaries
          SIDEFILE=$(ls ../dist | grep -E '^liri_terminal' | head -n1 || true)
          if [ -z "$SIDEFILE" ]; then
            echo "ERROR: sidecar binary not found in ../dist"
            exit 1
          fi
          cp "../dist/${SIDEFILE}" "src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"
        shell: bash
        if: matrix.config.os != 'windows-latest'

      - name: Clean bundle output (prevent stale installers from cache)
        shell: bash
        run: rm -rf src-tauri/target/release/bundle

      - name: Build Tauri app
        run: bun run tauri build --bundles ${{ matrix.config.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer-${{ matrix.config.name }}
          path: |
            client/src-tauri/target/release/bundle/

  # ══════════════════════════════════════════════
  # 产物冒烟（Phase2 #5）：在解压/安装后的干净目录运行 --smoke
  # ══════════════════════════════════════════════
  artifact-smoke:
    name: Artifact Smoke (${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    needs: [portable-bundle, tauri-build]
    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: win-x64
            os: windows-latest
            platform: win-x64
          - display: macos-arm64
            os: macos-latest
            platform: macos-arm64
          - display: linux-x64
            os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: portable

      - name: Smoke portable full zip (解压后干净目录运行)
        shell: bash
        run: |
          set -euo pipefail
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # 诊断双通道：step summary（Actions 页面）+ ::error:: annotation（匿名 check-run API 可读）
          fail() {
            local msg="$1" dir="${2:-.}"
            echo "::error::SMOKE FAIL $msg"
            { echo "### FAIL: $msg"; echo '```'; ls -la "$dir" 2>/dev/null || true; echo '```'; } >> "$SUMMARY"
            exit 1
          }
          echo "## Smoke portable (${{ matrix.platform }})" >> "$SUMMARY"
          FULL_ZIP=$(ls portable/liri-*-${{ matrix.platform }}-full.zip 2>/dev/null | head -n1 || true)
          if [[ -z "$FULL_ZIP" ]]; then
            fail "setup: zip not found (liri-*-${{ matrix.platform }}-full.zip)" "$GITHUB_WORKSPACE/portable"
          fi
          echo "SMOKE_STEP 1/4 zip=$FULL_ZIP"
          echo "- zip: $(basename "$FULL_ZIP")" >> "$SUMMARY"
          echo "- bun runtime size: $(stat -c%s "$(command -v bun)" 2>/dev/null || echo '?') bytes (PATH bun)" >> "$SUMMARY"
          rm -rf /tmp/liri-smoke && mkdir -p /tmp/liri-smoke
          cd /tmp/liri-smoke
          echo "SMOKE_STEP 2/4 extract"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Git for Windows 不带 unzip.exe；用 PowerShell Expand-Archive（与打包侧 Compress-Archive 对应）
            ZIP_WIN=$(cygpath -w "$GITHUB_WORKSPACE/portable/$(basename "$FULL_ZIP")")
            if ! powershell -NoProfile -Command "Expand-Archive -LiteralPath '$ZIP_WIN' -DestinationPath (Get-Location).Path -Force"; then
              fail "extract(win): Expand-Archive failed for $ZIP_WIN"
            fi
          else
            if ! unzip -q -o "$GITHUB_WORKSPACE/portable/$(basename "$FULL_ZIP")"; then
              fail "extract(unix): unzip failed"
            fi
          fi
          echo "SMOKE_STEP 3/4 verify bun"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            test -f runtime/bun.exe || fail "verify: runtime/bun.exe missing"
            echo "- runtime/bun.exe size: $(stat -c%s runtime/bun.exe 2>/dev/null || wc -c < runtime/bun.exe) bytes" >> "$SUMMARY"
          else
            test -f runtime/bun || fail "verify: runtime/bun missing"
          fi
          echo "SMOKE_STEP 4/4 run --smoke"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            if ! ./runtime/bun.exe run ./liri.js --smoke > /tmp/smoke.log 2>&1; then
              echo "::error::SMOKE FAIL smoke(win): $(tail -3 /tmp/smoke.log | tr '\r\n' '  ' | head -c 350)"
              { echo "### FAIL: bun --smoke (windows)"; echo '```'; tail -30 /tmp/smoke.log; echo '```'; } >> "$SUMMARY"
              exit 1
            fi
          else
            if ! ./runtime/bun run ./liri.js --smoke; then
              fail "smoke(unix): bun --smoke failed"
            fi
          fi
          echo "- result: PASS" >> "$SUMMARY"

      - name: Download Windows installer (win smoke)
        uses: actions/download-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: tauri-installer-Windows
          path: installers

      - name: Smoke NSIS install (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          function Add-Summary([string]$msg) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $msg -Encoding utf8 }
          Add-Summary "## Smoke NSIS install (windows)"
          $setup = Get-ChildItem installers -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) {
            Write-Host "::error::NSIS FAIL: setup not found in installers/"
            Add-Summary "### FAIL: NSIS setup not found"
            Add-Summary '```'
            Get-ChildItem installers -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Add-Summary $_.FullName }
            Add-Summary '```'
            Write-Error "NSIS setup not found"; exit 1
          }
          Add-Summary "- setup: $($setup.FullName)"
          Write-Host "Installing (perUser, /S silent, no UAC): $($setup.FullName)"
          $proc = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Host "::error::NSIS FAIL: installer exited with code $($proc.ExitCode)"
            Add-Summary "### FAIL: installer exit=$($proc.ExitCode)"
            Write-Error "installer failed exit=$($proc.ExitCode)"; exit 1
          }
          # Tauri NSIS installMode=currentUser 模板事实：安装目录为
          # $LOCALAPPDATA\<productName>（无 Programs 子目录）；sidecar（externalBin）
          # 安装时去掉 target triple 后缀（Tauri 约定：binaries/liri_terminal-<triple>.exe
          # → 安装目录 liri_terminal.exe）。
          # bun --compile 的 external（sharp/pdfjs/yoga）按进程启动 cwd 的 node_modules
          # 解析，故 smoke 必须在安装目录内运行（与 backend_ctrl.rs 锚定 cwd 的产品行为一致）。
          $installDir = Join-Path $env:LOCALAPPDATA 'Liri'
          $exe = Join-Path $installDir 'liri_terminal.exe'
          if (-not (Test-Path $exe)) {
            $cand = (Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter 'liri_terminal*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
            Write-Host "::error::NSIS FAIL: sidecar not found at $exe (candidate: $cand)"
            Add-Summary "### FAIL: sidecar not found at $exe"
            Add-Summary '```'
            Add-Summary "installDir exists: $(Test-Path $installDir)"
            if (Test-Path $installDir) { Get-ChildItem $installDir | ForEach-Object { Add-Summary $_.Name } }
            if ($cand) { Add-Summary "candidate: $cand" }
            Add-Summary '```'
            Write-Error "sidecar not found at $exe"; exit 1
          }
          Add-Summary "- exe: $exe"
          Write-Host "Smoking (cwd=$installDir): $exe --smoke"
          Push-Location $installDir
          try {
            & $exe --smoke 2>&1 | Tee-Object -Variable smokeOut
            $smokeCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($smokeCode -ne 0) {
            $tail = ($smokeOut | Select-Object -Last 3) -join ' | '
            Write-Host "::error::NSIS FAIL: sidecar --smoke exit=$smokeCode :: $tail"
            Add-Summary "### FAIL: smoke exit=$smokeCode"
            Add-Summary '```'
            $smokeOut | Select-Object -Last 30 | ForEach-Object { Add-Summary $_ }
            Add-Summary '```'
            Write-Error "smoke failed exit=$smokeCode"; exit 1
          }
          Add-Summary "- result: PASS"
          Write-Host "Uninstalling"
          $uninst = Join-Path $installDir 'uninstall.exe'
          if (Test-Path $uninst) { Start-Process $uninst -ArgumentList '/S' -Wait } else { Write-Host "uninstall.exe not found, skip uninstall" }

  # ══════════════════════════════════════════════
  # GitHub Release（单档收敛 2026-09-10：每平台 1 安装器 + 1 full zip；汇总校验和）
  # ══════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [portable-bundle, tauri-build, artifact-smoke]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Tauri installers
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-installer-*
          path: installers
          merge-multiple: true

      - name: Download all portable bundles
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: portable
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        run: |
          cat portable/checksums-*.txt | sort -u > portable/checksums.txt

      - name: List release assets
        run: |
          echo "=== Tauri installers ==="
          find installers/ -type f | sort || true
          echo ""
          echo "=== Portable bundles ==="
          find portable/ -type f | sort || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            installers/**/*-setup.exe
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
            portable/**/*.zip
            portable/checksums*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
