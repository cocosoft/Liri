name: Release Cross-Platform

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════
  # Lint & Test（所有 push/PR 均运行）
  # ══════════════════════════════════════════════
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test tests/
        # 版本门禁：测试失败必须阻断发版（2026-08-15 评审修正）
        # 统一到 tests/ 目录（1956 pass 全绿），src/ 预存失败另登记处理

  # ══════════════════════════════════════════════
  # 便携包（方案 C）：full + update zip
  # 产物：liri-v{ver}-{platform}-full.zip / liri-v{ver}-update-{platform}.zip
  # 依赖布局统一 node_modules/（与 pkg / exe 同级），校验交给 verify-package.ts（契约驱动）
  # ══════════════════════════════════════════════
  portable-bundle:
    name: Portable Bundle (${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: app

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: win-x64
            os: windows-latest
            platform: win-x64

          - display: macos-arm64
            os: macos-latest
            platform: macos-arm64

          - display: linux-x64
            os: ubuntu-latest
            platform: linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 阶段 1-5：统一脚本链（与桌面 sidecar / Docker 同 variant=coding、同一依赖契约）
      - name: Generate variant
        run: bun run scripts/build-variant.ts --variant=coding
      - name: Build bundle
        run: bun run build:bundle
      - name: Setup runtime
        run: bun run build:runtime
      - name: Copy native deps
        run: bun run build:deps
      - name: Copy seed data
        run: bun run build:seed

      # 阶段 6：启动脚本
      - name: Generate launcher
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            printf '@echo off\r\nsetlocal\r\nset "LIRI_PROJECT_DIR=%%~dp0"\r\n"%%~dp0runtime\\bun.exe" run "%%~dp0liri.js" %%*\r\n' > ../dist/pkg/run.bat
          else
            printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport LIRI_PROJECT_DIR="$DIR"\n"$DIR/runtime/bun" run "$DIR/liri.js" "$@"\n' > ../dist/pkg/run.sh
            chmod +x ../dist/pkg/run.sh
          fi

      # 阶段 7：契约校验（缺项即红；检查项来自 package-manifest.ts / 产物结构）
      - name: Verify package (contract)
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            EXTRA_ARGS="--file=run.bat"
          else
            EXTRA_ARGS="--file=run.sh"
          fi
          bun run scripts/verify-package.ts --pkg=../dist/pkg --dir=runtime --dir=app/config --dir=app/docs --file=app/data/pyapp/SOUL.md $EXTRA_ARGS

      # 阶段 8：full zip
      - name: Package full zip
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          cd ../dist
          ZIP_NAME="liri-v${VER}-${{ matrix.platform }}-full.zip"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell Compress-Archive -Path pkg\* -DestinationPath "${ZIP_NAME}" -Force
          else
            cd pkg && zip -r "../${ZIP_NAME}" . && cd ..
          fi
          echo "Full package: ${ZIP_NAME}"

      # 阶段 9：update zip（依赖整体取自 pkg/node_modules，与 pkg 布局一致；文件名带平台防覆盖）
      - name: Package update zip
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          mkdir -p ../dist/update-tmp
          cp ../dist/pkg/liri.js ../dist/update-tmp/
          if [ -d "../dist/pkg/node_modules" ]; then
            cp -a "../dist/pkg/node_modules/." ../dist/update-tmp/node_modules/
          else
            echo "ERROR: pkg/node_modules missing"
            exit 1
          fi
          cd ../dist
          ZIP_NAME="liri-v${VER}-update-${{ matrix.platform }}.zip"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            powershell Compress-Archive -Path update-tmp\* -DestinationPath "${ZIP_NAME}" -Force
          else
            cd update-tmp && zip -r "../${ZIP_NAME}" . && cd ..
          fi
          rm -rf update-tmp
          echo "Update package: ${ZIP_NAME}"

      # 阶段 10：校验和（按平台命名，由 release job 汇总为一份全量）
      - name: Generate checksum
        shell: bash
        run: |
          cd ../dist
          for f in liri-*.zip; do
            sha256sum "$f" >> checksums-${{ matrix.platform }}.txt
          done

      # 阶段 11：体积门禁（超限即失败；update 与 full 分别设上限）
      - name: Check package size
        shell: bash
        run: |
          FAIL=0
          check_size() {
            local f="$1" max="$2"
            SIZE_MB=$(du -m "$f" 2>/dev/null | cut -f1 || echo "0")
            echo "Package: $(basename $f) = ${SIZE_MB} MB (limit ${max}MB)"
            if [ "${SIZE_MB}" -gt "${max}" ] 2>/dev/null; then
              echo "FAIL: $(basename $f) exceeds ${max}MB"
              FAIL=1
            fi
          }
          for f in ../dist/liri-*-full.zip; do check_size "$f" 120; done
          for f in ../dist/liri-*-update-*.zip; do check_size "$f" 80; done
          if [ "$FAIL" -ne 0 ]; then echo "=== Size check FAILED ==="; exit 1; fi
          echo "Size check passed"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: |
            dist/liri-*.zip
            dist/checksums-${{ matrix.platform }}.txt
          retention-days: 30

  # ══════════════════════════════════════════════
  # Tauri 桌面客户端（嵌入 compile sidecar；独立并行，不再依赖 JS bundle）
  # ══════════════════════════════════════════════
  tauri-build:
    name: Build Tauri Client (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            sidecar-build: build:win:coding
            sidecar-ext: .exe

          - name: macOS (ARM)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            sidecar-build: build:mac
            sidecar-ext: ""

          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb
            sidecar-build: build:linux
            sidecar-ext: ""

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            client/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-tauri-${{ hashFiles('client/src-tauri/Cargo.lock', 'client/src-tauri/tauri.conf.json') }}

      - name: Install system dependencies (Linux)
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install client dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            bun install --frozen-lockfile && break || {
              if [ $attempt -lt 3 ]; then
                echo "Install failed, clearing cache and retrying..."
                bun pm cache rm
                sleep 5
              else
                echo "Final attempt failed"
                exit 1
              fi
            }
          done

      # 编译 sidecar（pyapp 单入口，统一 release-build 语义；产物落根 dist 供 tauri resources 整目录引用）
      - name: Build sidecar (${{ matrix.config.name }})
        working-directory: ${{ github.workspace }}/app
        shell: bash
        run: |
          set -euo pipefail
          echo "=== [0] Installing dependencies with retry ==="
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            bun install --frozen-lockfile && break || {
              if [ $attempt -lt 3 ]; then
                echo "Install failed, clearing cache and retrying..."
                bun pm cache rm
                sleep 5
              else
                echo "Final attempt failed"
                exit 1
              fi
            }
          done

          echo "=== [1] Building sidecar binary ==="
          BUILD_OUTPUT=$(bun run ${{ matrix.config.sidecar-build }} 2>&1) || {
            BUILD_EXIT=$?
            echo "ERROR: Sidecar build command failed with exit code $BUILD_EXIT"
            echo "$BUILD_OUTPUT"
            exit 1
          }

          if ! ls ../dist/liri_terminal* 1> /dev/null 2>&1; then
            echo "ERROR: no liri_terminal* file found in ../dist"
            ls -la ../dist/ || true
            exit 1
          fi

          SIDEFILE=$(ls ../dist | grep -E '^liri_terminal' | head -n1)
          echo "Found sidecar binary: $SIDEFILE"
          if [ "$SIDEFILE" != "liri_terminal${{ matrix.config.sidecar-ext }}" ]; then
            mv "../dist/$SIDEFILE" "../dist/liri_terminal${{ matrix.config.sidecar-ext }}"
          fi
          # compile 产物契约校验（node_modules 含全部 externals，缺项即红）
          bun run scripts/verify-package.ts --pkg=../dist

      - name: Copy sidecar to Tauri binaries dir
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          $side = Get-ChildItem -Path "../dist/*" -Include "liri_terminal*" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $side) {
            Write-Error "ERROR: sidecar binary not found in ../dist"
            exit 1
          }
          Write-Host "Copying sidecar: $($side.Name)"
          Copy-Item $side.FullName "src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}" -Force
        shell: powershell
        if: matrix.config.os == 'windows-latest'

      - name: Copy sidecar to Tauri binaries dir (Unix)
        run: |
          mkdir -p src-tauri/binaries
          SIDEFILE=$(ls ../dist | grep -E '^liri_terminal' | head -n1 || true)
          if [ -z "$SIDEFILE" ]; then
            echo "ERROR: sidecar binary not found in ../dist"
            exit 1
          fi
          cp "../dist/${SIDEFILE}" "src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"
        shell: bash
        if: matrix.config.os != 'windows-latest'

      - name: Build Tauri app
        run: bun run tauri build --bundles ${{ matrix.config.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer-${{ matrix.config.name }}
          path: |
            client/src-tauri/target/release/bundle/

  # ══════════════════════════════════════════════
  # 产物冒烟（Phase2 #5）：在解压/安装后的干净目录运行 --smoke
  # ══════════════════════════════════════════════
  artifact-smoke:
    name: Artifact Smoke (${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    needs: [portable-bundle, tauri-build]
    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: win-x64
            os: windows-latest
            platform: win-x64
          - display: macos-arm64
            os: macos-latest
            platform: macos-arm64
          - display: linux-x64
            os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: portable

      - name: Smoke portable full zip (解压后干净目录运行)
        shell: bash
        run: |
          set -euo pipefail
          FULL_ZIP=$(ls portable/liri-*-${{ matrix.platform }}-full.zip | head -n1)
          echo "Smoking: $FULL_ZIP"
          rm -rf /tmp/liri-smoke && mkdir -p /tmp/liri-smoke
          cd /tmp/liri-smoke
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Windows 自带 bsdtar 支持 zip 且退出码可靠（git-bash 下 Expand-Archive '.' 的 cwd 解析不稳定）
            tar -xf "$GITHUB_WORKSPACE/portable/$(basename "$FULL_ZIP")"
          else
            unzip -q "$GITHUB_WORKSPACE/$FULL_ZIP"
          fi
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            test -f runtime/bun.exe || { echo "ERROR: runtime/bun.exe missing after extract"; ls -la; exit 1; }
            ./runtime/bun.exe run ./liri.js --smoke
          else
            test -f runtime/bun || { echo "ERROR: runtime/bun missing after extract"; ls -la; exit 1; }
            ./runtime/bun run ./liri.js --smoke
          fi

      - name: Download Windows installer (win smoke)
        uses: actions/download-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: tauri-installer-Windows
          path: installers

      - name: Smoke MSI install (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $msi = Get-ChildItem installers -Recurse -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "MSI not found"; exit 1 }
          Write-Host "Installing: $($msi.FullName)"
          Start-Process msiexec.exe -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart" -Wait
          $exe = "C:\Program Files\Liri\liri_terminal.exe"
          if (-not (Test-Path $exe)) { Write-Error "sidecar not found at $exe"; exit 1 }
          Write-Host "Smoking: $exe --smoke"
          & $exe --smoke
          if ($LASTEXITCODE -ne 0) { Write-Error "smoke failed exit=$LASTEXITCODE"; exit 1 }
          Write-Host "Uninstalling"
          Start-Process msiexec.exe -ArgumentList "/x `"$($msi.FullName)`" /qn /norestart" -Wait

  # ══════════════════════════════════════════════
  # GitHub Release（汇总校验和；附件含平台化 update.zip）
  # ══════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [portable-bundle, tauri-build, artifact-smoke]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all Tauri installers
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-installer-*
          path: installers
          merge-multiple: true

      - name: Download all portable bundles
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: portable
          merge-multiple: true

      - name: Aggregate checksums
        shell: bash
        run: |
          cat portable/checksums-*.txt | sort -u > portable/checksums.txt

      - name: List release assets
        run: |
          echo "=== Tauri installers ==="
          find installers/ -type f | sort || true
          echo ""
          echo "=== Portable bundles ==="
          find portable/ -type f | sort || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            installers/**/*.msi
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
            portable/**/*.zip
            portable/checksums*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
