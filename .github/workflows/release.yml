name: Release Cross-Platform

on:
  # 仅在**发版 tag** 运行：main/PR 的 lint+test 由 ci.yml 覆盖
  # （原同时监听 main/PR ⇒ 每次推送重复一遍 4 分钟 lint/test，纯浪费）。
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════
  # Lint & Test（所有 push/PR 均运行）
  # ══════════════════════════════════════════════
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        # 门禁自证 / 集成类用例会 spawn `bun`/lint 脚本：实测 Linux 容器 8–28s，
        # 超过 bun test 默认 5s ⇒ 发布流水线稳定超时假红。统一放宽到 30s（仍为有界）。
        env:
          # 真链 E2E 必须执行（2026-10-25）：找不到 Python 解释器 ⇒ 报红，不静默 skip
          PYTHON_E2E_REQUIRE: '1'
        run: bun test tests/ --timeout 30000
        # 2026-08-30 修复：与 ci.yml 的 Test Suite 对齐（`bun test tests/`）。
        # 原 `bun test`（全量）会跑 src/ 下测试，其中 29 个预存断言失败（JsonRpcBridge
        # /MiniMaxVideoProvider/KB-IT 等，独立模块长期未修）→ Release 长期被阻塞。
        # 统一到 tests/ 目录（1956 pass 全绿），src/ 测试失败另登记处理。
        # 版本门禁：测试失败必须阻断发版（2026-08-15 评审修正，
        # 原 continue-on-error 允许测试挂掉仍继续发布）

  # ══════════════════════════════════════════════
  # JS Bundle（平台无关，供 Tauri sidecar 使用）
  # ══════════════════════════════════════════════
  bundle:
    needs: lint-test
    name: Bundle JS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Bundle JS
        run: bun build --target=bun --packages=external src/main.ts --outdir=dist

      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: app/dist/

  # ══════════════════════════════════════════════
  # 便携 Bun + Bundle 完整包（方案 C）
  # 产物：liri-v{version}-{platform}-full.zip + update.zip
  # ══════════════════════════════════════════════
  portable-bundle:
    name: Portable Bundle (${{ matrix.display }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: app

    strategy:
      fail-fast: false
      matrix:
        include:
          - display: win-x64
            os: windows-latest
            bun-target: bun-windows-x64-modern
            platform: win-x64
            ext: .exe

          - display: macos-arm64
            os: macos-latest
            bun-target: bun-darwin-arm64-modern
            platform: macos-arm64
            ext: ""

          - display: linux-x64
            os: ubuntu-latest
            bun-target: bun-linux-x64-modern
            platform: linux-x64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 阶段 1：变体构建
      - name: Generate variant
        run: bun run scripts/build-variant.ts --variant=personal

      # 阶段 2：打包业务代码
      - name: Build bundle
        run: bun run build:bundle

      # 阶段 3：复制运行时
      - name: Setup runtime
        run: bun run build:runtime

      # 阶段 4：复制原生依赖
      - name: Copy native deps
        run: bun run build:deps

      # 阶段 4b（T25-09，2026-10-25）：构建并复制 **Rust 原生库** —— 此前发布链完全没有
      # cargo 步骤、`build:deps` 也只复制 3 个 npm 包 ⇒ 发布包缺 `libliri_native.*`，
      # 运行时静默降级 JS（Rust AST 加速在发布包里等于未生效）。
      # `--require` ⇒ 缺库即失败（fail-closed），不把"静默降级"带进发布物。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build native core (release)
        working-directory: app/native
        run: cargo build --release

      - name: Copy native lib into bundle
        run: bun run build:native

      # 阶段 4c（T25-11a，2026-10-25）：构建 **landlock-run helper** 并放进 `<bundle>/bin/`。
      # 此前发布链从不构建/分发它 ⇒ Linux 用户开 `sandbox.landlock.bashEnabled` 也只会
      # `capability-unavailable` 被拒（安全但功能不可用）；`code_run` 则静默降级。
      # 仅 Linux 需要（Landlock 是 Linux 内核特性）；`--require` ⇒ 编译失败即失败。
      - name: Build landlock helper (Linux only)
        if: runner.os == 'Linux'
        run: bun run build:landlock

      # 阶段 5：复制种子数据
      - name: Copy seed data
        run: bun run build:seed

      # 阶段 6：生成启动脚本
      - name: Generate launcher
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            printf '@echo off\r\nsetlocal\r\nset "LIRI_PROJECT_DIR=%%~dp0"\r\n"%%~dp0runtime\\bun.exe" run "%%~dp0liri.js" %%*\r\n' > ../dist/pkg/run.bat
          else
            printf '#!/bin/bash\nDIR="$(cd "$(dirname "$0")" && pwd)"\nexport LIRI_PROJECT_DIR="$DIR"\n"$DIR/runtime/bun" run "$DIR/liri.js" "$@"\n' > ../dist/pkg/run.sh
            chmod +x ../dist/pkg/run.sh
          fi

      # 阶段 7：打包完整包
      - name: Package full zip
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          cd ../dist
          ZIP_NAME="liri-v${VER}-${{ matrix.platform }}-full.zip"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # 必须用单引号 'pkg/*'：经 bash 传递时 `pkg\*` 的反斜杠被吞 ⇒ PowerShell 收到 `pkg*`，
            # 只匹配到目录本身 ⇒ zip 根层多一层 `pkg/`，解包后根目录没有 liri.js（冒烟 [2/4] 失败）。
            # 本地实证：-Path pkg* → 条目 `pkg\liri.js`；-Path 'pkg/*' → 条目 `liri.js`。
            powershell -NoProfile -Command "Compress-Archive -Path 'pkg/*' -DestinationPath '${ZIP_NAME}' -Force"
          else
            cd pkg && zip -r "../${ZIP_NAME}" . && cd ..
          fi

          echo "Full package: ${ZIP_NAME} ($(du -h ${ZIP_NAME} 2>/dev/null | cut -f1 || echo 'unknown'))"

      # 阶段 8：增量包
      - name: Package update zip
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          mkdir -p ../dist/update-tmp
          cp ../dist/pkg/liri.js ../dist/update-tmp/
          # C-3b：prompts 为运行时读盘资源，文案随版本变化 ⇒ 增量包必须携带
          if [ -d "../dist/pkg/prompts" ]; then
            cp -r ../dist/pkg/prompts ../dist/update-tmp/prompts
          fi
          if [ -d "../dist/pkg/node_modules" ]; then
            mkdir -p ../dist/update-tmp/deps/node_modules
            for dep in sharp pdfjs-dist yoga-layout; do
              if [ -d "../dist/pkg/node_modules/$dep" ]; then
                cp -r "../dist/pkg/node_modules/$dep" ../dist/update-tmp/deps/node_modules/
              fi
            done
          fi
          cd ../dist
          ZIP_NAME="liri-v${VER}-update.zip"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # 同「Package full zip」：必须单引号 'update-tmp/*'，否则 zip 根层多一层 update-tmp/。
            powershell -NoProfile -Command "Compress-Archive -Path 'update-tmp/*' -DestinationPath '${ZIP_NAME}' -Force"
          else
            cd update-tmp && zip -r "../${ZIP_NAME}" . && cd ..
          fi
          rm -rf update-tmp
          echo "Update package: ${ZIP_NAME}"

      # 校验和
      - name: Generate checksum
        shell: bash
        run: |
          cd ../dist
          for f in liri-*.zip; do
            sha256sum "$f" >> checksums.txt
          done

      # 包体积监控
      - name: Check package size
        shell: bash
        run: |
          MAX_SIZE_MB=120
          for f in ../dist/liri-*-full.zip; do
            SIZE_MB=$(du -m "$f" 2>/dev/null | cut -f1 || echo "0")
            echo "Package: $(basename $f) = ${SIZE_MB} MB"
            if [ "${SIZE_MB}" -gt "${MAX_SIZE_MB}" ] 2>/dev/null; then
              echo "WARNING: Package size ${SIZE_MB}MB exceeds limit ${MAX_SIZE_MB}MB"
            fi
          done
          echo "Size check complete"

      # 构建产物验证
      - name: Verify package
        shell: bash
        run: |
          echo "=== Verifying package structure ==="
          PKG_DIR="../dist/pkg"
          for f in "liri.js"; do
            if [ -f "$PKG_DIR/$f" ]; then echo "  ✅ $f"; else echo "  ❌ $f MISSING"; fi
          done
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            if [ -f "$PKG_DIR/run.bat" ]; then echo "  ✅ run.bat"; else echo "  ❌ run.bat MISSING"; fi
          else
            if [ -f "$PKG_DIR/run.sh" ]; then echo "  ✅ run.sh"; else echo "  ❌ run.sh MISSING"; fi
          fi
          if [ -d "$PKG_DIR/runtime" ]; then echo "  ✅ runtime/"; fi
          if [ -d "$PKG_DIR/node_modules/sharp" ]; then echo "  ✅ deps/sharp"; fi
          if [ -d "$PKG_DIR/app/config" ]; then echo "  ✅ app/config/ (startup.yaml)"; fi
          if [ -d "$PKG_DIR/app/docs" ]; then echo "  ✅ app/docs/"; fi
          if [ -d "$PKG_DIR/app/trusted-keys" ]; then echo "  ✅ app/trusted-keys/ (official plugin pubkeys)"; fi
          if [ -f "$PKG_DIR/app/package.json" ]; then echo "  ✅ app/package.json (runtime version)"; fi
          if [ -f "$PKG_DIR/app/data/pyapp/SOUL.md" ]; then echo "  ✅ app/data/pyapp/SOUL.md"; fi
          echo "=== Verification passed ==="

      # ── L-12.1（2026-10-09）：干净环境冒烟「解包 → 首启 → 清理」────────────
      # 外部 §5.3-4：开发环境通过**不能**证明打包产物具备相同的路径/环境变量/原生模块行为。
      # 本步对**真实 zip 产物**在全新临时目录中解包并首启，断言：
      #   ① 关键路径存在；② `healthcheck` 退出码 0 且**版本 = 发布版本**；
      #   ③ 便携约束：不向包内自身目录写入；④ 清理后临时目录消失。
      # 注：`healthcheck` 模式在 bootstrap（T1_module_init）**之后**分发 ⇒ 证明产物可加载 + 可完成引导。
      - name: Smoke test (clean env)
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.version }}"
          ZIP="../dist/liri-v${VER}-${{ matrix.platform }}-full.zip"
          SMOKE_ROOT="$(mktemp -d)"
          PKG="$SMOKE_ROOT/pkg"
          mkdir -p "$PKG"
          echo "smoke root: $SMOKE_ROOT"

          echo "=== [1/4] 解包（全新临时目录）==="
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            # Git Bash 的 POSIX 路径需转 Windows 形式再交给 PowerShell
            ZIP_WIN="$(cygpath -w "$ZIP")"
            PKG_WIN="$(cygpath -w "$PKG")"
            powershell -NoProfile -Command "Expand-Archive -Path '${ZIP_WIN}' -DestinationPath '${PKG_WIN}' -Force"
          else
            unzip -q "$ZIP" -d "$PKG"
            chmod +x "$PKG/run.sh" 2>/dev/null || true
          fi

          echo "=== [2/4] 断言关键路径 ==="
          for p in liri.js runtime app/config app/docs app/trusted-keys app/package.json; do
            if [[ -e "$PKG/$p" ]]; then echo "  ✅ $p"; else echo "  ❌ $p MISSING"; exit 1; fi
          done
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            [[ -f "$PKG/run.bat" ]] || { echo "  ❌ run.bat MISSING"; exit 1; }
          else
            [[ -f "$PKG/run.sh" ]] || { echo "  ❌ run.sh MISSING"; exit 1; }
          fi

          echo "=== [3/4] 首启冒烟（隔离 LIRI_HOME · 断言退出码/版本/无包内写入）==="
          find "$PKG" -type f | sort > "$SMOKE_ROOT/before.txt"
          export LIRI_HOME="$SMOKE_ROOT/home"
          cd "$PKG"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            OUT="$(cmd.exe //c run.bat healthcheck 2>&1)" || { echo "$OUT" | tail -n 30; echo "❌ healthcheck 退出非 0"; exit 1; }
          else
            OUT="$(./run.sh healthcheck 2>&1)" || { echo "$OUT" | tail -n 30; echo "❌ healthcheck 退出非 0"; exit 1; }
          fi
          echo "$OUT" | tail -n 12
          echo "$OUT" | grep -q "LIRI_HEALTHCHECK_OK" || { echo "❌ 缺少 healthcheck 标记"; exit 1; }
          echo "$OUT" | grep -q "version: ${VER}" || { echo "❌ 版本不匹配（期望 ${VER}）"; exit 1; }
          find "$PKG" -type f | sort > "$SMOKE_ROOT/after.txt"
          if ! diff -q "$SMOKE_ROOT/before.txt" "$SMOKE_ROOT/after.txt" >/dev/null; then
            echo "❌ 便携包不应向自身目录写入，但检测到新增文件："
            diff "$SMOKE_ROOT/before.txt" "$SMOKE_ROOT/after.txt" || true
            exit 1
          fi
          echo "  ✅ 退出码 0 · 版本 ${VER} · 包内无写入"

          echo "=== [4/4] 卸载 / 清理 ==="
          cd "$GITHUB_WORKSPACE"
          rm -rf "$SMOKE_ROOT"
          [[ ! -e "$SMOKE_ROOT" ]] || { echo "❌ 清理失败"; exit 1; }
          echo "✅ 干净环境冒烟通过（解包 → 首启 → 清理）"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: |
            dist/liri-*.zip
            dist/checksums.txt
          retention-days: 30

  # ══════════════════════════════════════════════
  # Tauri 桌面客户端（嵌入 sidecar）
  # ══════════════════════════════════════════════
  tauri-build:
    name: Build Tauri Client (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            sidecar-build: build:win:coding
            sidecar-ext: .exe

          - name: macOS (ARM)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            sidecar-build: build:mac
            sidecar-ext: ""

          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # AppImage 恢复（2026-10-27）：此前 v0.5.13/15/16 三次失败，v0.5.17 临时只出 deb 定位。
            # 本地 Docker 复现确认根因：sidecar 依赖里带入了 musl 变体
            # （`@napi-rs/canvas-linux-x64-musl` 等），linuxdeploy 对 AppDir 内每个 ELF 递归
            # `ldd`，musl 的 `.node` 在 glibc 宿主上报 `invalid ELF header` ⇒
            # `Failed to run ldd` ⇒ Tauri 只回显 `failed to run linuxdeploy`。
            # 已由 `app/scripts/copy-external-deps.ts` 裁剪异平台原生包修复（容器内实测出包）。
            bundles: deb,appimage
            sidecar-build: build:linux
            sidecar-ext: ""

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            client/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-tauri-${{ hashFiles('client/src-tauri/Cargo.lock', 'client/src-tauri/tauri.conf.json') }}

      - name: Download JS dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: app/dist

      - name: Install system dependencies (Linux)
        if: matrix.config.os == 'ubuntu-latest'
        # 2026-10-27 实测：v0.5.15 的 release **卡在这一步 15 分钟超时**（job 15m38s，
        # 之后 7 个步骤全部 skipped，Linux 无任何产物）。⇒ ① 超时 15 → 25 分钟；
        # ② `--no-install-recommends` 缩小下载量；③ 每条命令用 `timeout` 兜底 + 打时间戳，
        # 让"卡在哪一条"能从日志直接读出，而不是整步静默到超时。
        env:
          DEBIAN_FRONTEND: noninteractive
        timeout-minutes: 25
        run: |
          set -x
          date -u +"step-start %H:%M:%S"
          timeout 600 sudo apt-get update \
            -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          date -u +"after-update %H:%M:%S"
          timeout 900 sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev
          date -u +"after-install %H:%M:%S"
          # AppImage 工具链（linuxdeploy / appimagetool）是 AppImage 形态，部分 runner 上
          # 仍会去加载 libfuse.so.2。24.04 包名为 libfuse2t64，22.04 为 libfuse2 ⇒ 两者择一。
          timeout 180 sudo apt-get install -y --no-install-recommends libfuse2 \
            || timeout 180 sudo apt-get install -y --no-install-recommends libfuse2t64 \
            || true
          date -u +"step-done %H:%M:%S"

      - name: Install client dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            bun install --frozen-lockfile && break || {
              if [ $attempt -lt 3 ]; then
                echo "Install failed, clearing cache and retrying..."
                bun pm cache rm
                sleep 5
              else
                echo "Final attempt failed"
                exit 1
              fi
            }
          done

      - name: Build sidecar (${{ matrix.config.name }})
        working-directory: ${{ github.workspace }}/app
        shell: bash
        run: |
          set -euo pipefail

          echo "=== [0] Installing dependencies with retry ==="
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            bun install --frozen-lockfile && break || {
              if [ $attempt -lt 3 ]; then
                echo "Install failed, clearing cache and retrying..."
                bun pm cache rm
                sleep 5
              else
                echo "Final attempt failed"
                exit 1
              fi
            }
          done

          echo "=== [1] Check for downloaded dist bundle ==="
          if [ -d dist ] && [ "$(ls -A dist 2>/dev/null || true)" ]; then
            echo "Using downloaded JS bundle in dist/"
          else
            echo "No downloaded dist found; building JS bundle locally"
            bun build --target=bun --packages=external src/main.ts --outdir=dist
          fi

          echo "=== [2] Building sidecar binary ==="
          echo "Running: bun run ${{ matrix.config.sidecar-build }}"

          # 捕获完整输出（stdout+stderr），失败时展示以辅助排查
          BUILD_OUTPUT=$(bun run ${{ matrix.config.sidecar-build }} 2>&1) || {
            BUILD_EXIT=$?
            echo "ERROR: Sidecar build command failed with exit code $BUILD_EXIT"
            echo "Build output:"
            echo "$BUILD_OUTPUT"
            echo "=== Checking ../dist contents ==="
            ls -lah ../dist/ 2>/dev/null || echo "../dist/ does not exist"
            echo "=== Checking app/dist contents ==="
            ls -lah dist/ 2>/dev/null || true
            exit 1
          }

          echo "Build output:"
          echo "$BUILD_OUTPUT"

          echo "=== [3] Verifying build artifacts ==="
          echo "=== Contents of ../dist after sidecar build ==="
          ls -lah ../dist/ || true
          echo "=== Contents of dist/ (JS bundle) ==="
          ls -lah dist/ || true

          # 验证 sidecar 二进制是否存在（停留在 app/ 目录内，不 cd 进 ../dist）
          if ! ls ../dist/liri_terminal* 1> /dev/null 2>&1; then
            echo "ERROR: no liri_terminal* file found in ../dist after sidecar build"
            echo "Directory contents:"
            ls -la ../dist/
            exit 1
          fi

          SIDEFILE=$(ls ../dist | grep -E '^liri_terminal' | head -n1)
          echo "Found sidecar binary: $SIDEFILE ($(du -sh "../dist/$SIDEFILE" | cut -f1))"

          # 归一化 sidecar 产物名称为 liri_terminal，供下游 copy 步骤使用
          if [ "$SIDEFILE" != "liri_terminal${{ matrix.config.sidecar-ext }}" ]; then
            echo "Renaming $SIDEFILE -> liri_terminal${{ matrix.config.sidecar-ext }}"
            mv "../dist/$SIDEFILE" "../dist/liri_terminal${{ matrix.config.sidecar-ext }}"
          fi

          echo "Sidecar build completed successfully."

      - name: Verify sidecar artifact
        run: |
          echo "=== ../dist ==="
          ls -la ../dist || true
          echo "=== ../app/node_modules ==="
          ls -la ../app/node_modules || true
        shell: bash

      - name: Copy sidecar to Tauri binaries dir
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          # Match the sidecar output: liri_terminal*
          # NOTE: with -Include, -Path must end with \* when pointing at a directory,
          # otherwise -Include silently matches nothing.
          $side = Get-ChildItem -Path "../dist/*" -Include "liri_terminal*" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $side) {
            Write-Error "ERROR: sidecar binary not found in ../dist"
            Write-Host "=== ../dist contents for debugging ==="
            Get-ChildItem ../dist -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Copying sidecar: $($side.Name) -> src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"
          Copy-Item $side.FullName "src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}" -Force

          # NOTE: this step is `shell: powershell` (Windows PowerShell 5.1), which reads the
          # generated .ps1 with the ANSI code page. Non-ASCII characters (e.g. Chinese) get
          # mojibaked and can swallow the closing quote => ParserError "Missing closing '}'".
          # Keep this script strictly ASCII-only.
          # Copy only the external modules required at runtime (sharp + pdfjs-dist) and their
          # full dependency trees; do not copy all 480+ packages.
          # Bun --compile resolves externals from the node_modules next to the exe (pyapp.ts
          # already chdirs to the exe dir); tauri resources map binaries/deps => $RESOURCES/node_modules.
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/deps/node_modules
          if (Test-Path ../dist/node_modules) {
            Get-ChildItem -Path ../dist/node_modules -Force | Copy-Item -Destination src-tauri/binaries/deps/node_modules -Recurse -Force
          } else {
            Write-Warning "dist/node_modules not found, copying from app/node_modules (sharp + pdfjs-dist only)"
            foreach ($pkg in @('sharp', 'pdfjs-dist')) {
              $src = "../app/node_modules/$pkg"
              if (Test-Path $src) {
                Copy-Item -Path $src -Destination "src-tauri/binaries/deps/node_modules/$pkg" -Recurse -Force
              } else {
                Write-Error "ERROR: required native module '$pkg' not found at $src"
                exit 1
              }
            }
          }
          Write-Host "=== binaries/deps/node_modules contents ==="
          Get-ChildItem src-tauri/binaries/deps/node_modules -Directory | Select-Object Name

          # C-3b/T2: prompts are a runtime on-disk resource -- same source as the `prompts`
          # entry in `bundle.resources`; copy next to the sidecar (execPath sibling lookup).
          if (Test-Path ../dist/prompts) {
            Copy-Item -Path ../dist/prompts -Destination src-tauri/binaries/prompts -Recurse -Force
            Write-Host "=== binaries/prompts locales ==="
            Get-ChildItem src-tauri/binaries/prompts -Directory | Select-Object Name
          } else {
            Write-Error "ERROR: ../dist/prompts not found (build:win:coding should produce prompts/)"
            exit 1
          }
        shell: powershell
        if: matrix.config.os == 'windows-latest'

      - name: Copy sidecar to Tauri binaries dir (Unix)
        run: |
          mkdir -p src-tauri/binaries
          # 匹配 sidecar 输出
          SIDEFILE=$(ls ../dist | grep -E '^liri_terminal' | head -n1 || true)
          if [ -z "$SIDEFILE" ]; then
            echo "ERROR: sidecar binary not found in ../dist"
            echo "Listing ../dist for debugging:"
            ls -la ../dist || true
            exit 1
          fi
          echo "Copying sidecar from ../dist/${SIDEFILE} -> src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"
          cp "../dist/${SIDEFILE}" "src-tauri/binaries/liri_terminal-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}"

          # 只复制运行时必需的外部模块（sharp + pdfjs-dist）及其完整依赖树，不复制全部 480+ 包
          # Bun --compile 的 external 解析从 exe 同级 node_modules 查找（pyapp.ts 已 chdir 到 exe 目录）
          mkdir -p src-tauri/binaries/deps/node_modules
          if [ -d ../dist/node_modules ]; then
            cp -a ../dist/node_modules/. src-tauri/binaries/deps/node_modules/
          else
            echo "WARNING: dist/node_modules not found, copying from app/node_modules (sharp + pdfjs-dist only)"
            for pkg in sharp pdfjs-dist; do
              if [ -d "../app/node_modules/$pkg" ]; then
                cp -a "../app/node_modules/$pkg/." "src-tauri/binaries/deps/node_modules/$pkg/"
              else
                echo "ERROR: required native module '$pkg' not found at ../app/node_modules/$pkg"
                exit 1
              fi
            done
          fi
          echo "=== binaries/deps/node_modules contents ==="
          ls -d src-tauri/binaries/deps/node_modules/*/ 2>/dev/null || true

          # C-3b/T2：提示词是**运行时读盘**资源 —— 与 `bundle.resources` 的 `prompts`
          # 映射同源，复制到 sidecar 同级（本地/dev 侧车按 execPath 同级查找）。
          if [ -d ../dist/prompts ]; then
            mkdir -p src-tauri/binaries
            cp -a ../dist/prompts src-tauri/binaries/prompts
            echo "=== binaries/prompts locales ==="
            ls -d src-tauri/binaries/prompts/*/ 2>/dev/null || true
          else
            echo "ERROR: ../dist/prompts not found (build:mac/build:linux 应产出 prompts/)"
            exit 1
          fi
        shell: bash
        if: matrix.config.os != 'windows-latest'

      - name: Build Tauri app
        # AppImage 打包会下载并执行 linuxdeploy / appimagetool（AppImage 形态）。
        # 无 FUSE 的运行环境必须让它们自解包运行，否则报 `libfuse.so.2` 缺失。
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bun run tauri build --bundles ${{ matrix.config.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer-${{ matrix.config.name }}
          path: |
            client/src-tauri/target/release/bundle/

  # ══════════════════════════════════════════════
  # GitHub Release
  # ══════════════════════════════════════════════
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [bundle, portable-bundle, tauri-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Download all Tauri installers
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-installer-*
          path: installers
          merge-multiple: true

      - name: Download all portable bundles
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: portable
          merge-multiple: true

      - name: List release assets
        run: |
          echo "=== Dist bundle ==="
          ls -la dist/ || true
          echo ""
          echo "=== Tauri installers ==="
          find installers/ -type f | sort || true
          echo ""
          echo "=== Portable bundles ==="
          find portable/ -type f | sort || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/main.js
            installers/**/*.msi
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
            portable/**/*.zip
            portable/**/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
