name: Release Cross-Platform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle JS (platform-agnostic)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Bundle JS
        run: bun build --target=bun --packages=external src/main.ts --outdir=dist

      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: app/dist/

  tauri-build:
    name: Build Tauri Client (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}
    needs: bundle

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            sidecar-build: build:win:coding
            sidecar-ext: .exe

          - name: macOS (ARM)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            sidecar-build: build:mac
            sidecar-ext: ""

          - name: Linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb
            sidecar-build: build:linux
            sidecar-ext: ""

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            client/src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-tauri-${{ hashFiles('client/src-tauri/Cargo.lock') }}

      - name: Install system dependencies (Linux)
        if: matrix.config.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install client dependencies
        run: bun install --frozen-lockfile

      - name: Build sidecar (${{ matrix.config.name }})
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun build --target=bun --packages=external src/main.ts --outdir=dist
          bun run ${{ matrix.config.sidecar-build }}

      - name: Copy sidecar to Tauri binaries dir
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item ../app/dist/py_app_coding${{ matrix.config.sidecar-ext }} "src-tauri/binaries/py_app_coding-${{ matrix.config.target }}${{ matrix.config.sidecar-ext }}" -ErrorAction SilentlyContinue
        shell: powershell
        if: matrix.config.os == 'windows-latest'

      - name: Copy sidecar to Tauri binaries dir (Unix)
        run: |
          mkdir -p src-tauri/binaries
          cp ../app/dist/py_app_coding "src-tauri/binaries/py_app_coding-${{ matrix.config.target }}"
        shell: bash
        if: matrix.config.os != 'windows-latest'

      - name: Build Tauri app
        run: bun run tauri build --bundles ${{ matrix.config.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installer-${{ matrix.config.name }}
          path: |
            client/src-tauri/target/release/bundle/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [bundle, tauri-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Download all Tauri installers
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-installer-*
          path: installers
          merge-multiple: true

      - name: List installers
        run: |
          echo "=== Dist bundle ==="
          ls -la dist/
          echo "=== Installers ==="
          find installers/ -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/main.js
            installers/**/*.msi
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
