name: Release Cross-Platform

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle JS (platform-agnostic)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('app/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Bundle JS
        run: bun build --target=bun --packages=external src/main.ts --outdir=dist

      - name: Upload dist bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: app/dist/

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: bundle

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist bundle
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/main.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
