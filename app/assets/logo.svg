<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- 底圆 -->
  <circle cx="256" cy="256" r="240" fill="url(#g)" opacity="0.06"/>
  <circle cx="256" cy="256" r="230" stroke="url(#g)" stroke-width="4" opacity="0.15"/>

  <!-- 字母 L 为主体,右上角带鸟翼意象 -->
  <!-- L 竖 -->
  <rect x="180" y="160" width="44" height="180" rx="12" fill="url(#g)"/>
  <!-- L 横 -->
  <rect x="180" y="296" width="140" height="44" rx="12" fill="url(#g)"/>

  <!-- 翅膀 = 三条渐短斜线,从 L 竖右上方向外 -->
  <line x1="224" y1="200" x2="340" y2="170" stroke="url(#g)" stroke-width="16" stroke-linecap="round"/>
  <line x1="224" y1="230" x2="320" y2="210" stroke="url(#g)" stroke-width="12" stroke-linecap="round"/>
  <line x1="224" y1="260" x2="290" y2="248" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
</svg>
