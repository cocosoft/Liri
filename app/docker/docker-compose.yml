# =============================================================================
#  Liri — Docker Compose 配置
#  官网：https://openliri.com
#  参考 Windows 版：exe 直接运行，等同 docker-compose up 后进入交互界面
# =============================================================================
#  快速开始（本地开发，从源码构建）：
#    首次构建： cd app && docker compose -f docker/docker-compose.yml build
#    交互模式： docker compose -f docker/docker-compose.yml run --rm app
#    后台服务： docker compose -f docker/docker-compose.yml up -d
#    查看日志： docker compose -f docker/docker-compose.yml logs -f
#    停止：     docker compose -f docker/docker-compose.yml down
#
#  服务器部署（从 GHCR 拉取发布镜像，启用 Watchtower 自动升级）：
#    1. docker compose -f docker/docker-compose.yml pull app
#    2. docker compose -f docker/docker-compose.yml up -d
#    3. Watchtower 每 5 分钟检查 ghcr.io/cocosoft/liri 新镜像，
#       发现更新自动拉取并滚动重建 app 容器（--label-enable 只监控带标签的容器）
# =============================================================================

services:
  app:
    # 发布镜像（GitHub Actions 推送到 GHCR，见 .github/workflows/deploy-docker.yml）。
    # 服务器部署时 docker compose pull 拉取；本地开发用 build 从源码构建。
    image: ghcr.io/cocosoft/liri
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # 允许 Watchtower 自动升级本容器（配合 watchtower 服务的 --label-enable）
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # ── 交互模式（等同 Windows 版双击 Liri_coding.exe） ──
    #   docker compose -f docker/docker-compose.yml run --rm app
    #   如需传启动模式：docker compose -f docker/docker-compose.yml run --rm app mcp
    stdin_open: true
    tty: true

    # ── 环境变量 ──
    # 必须配置：DEEPSEEK_API_KEY
    # 从 .env 文件读取（和 Windows 版共用同一套配置）
    env_file:
      - ../.env
    environment:
      - LIRI_PROJECT_DIR=/app
      - LIRI_HOME=/app/app/data
      - LIRI_DATA_DIR=/app/app/data
      - LIRI_HTTP_PORT=3000
      - LIRI_HTTP_HOST=0.0.0.0

    # ── 持久化数据卷 ──
    # 数据库、会话、记忆等运行时数据通过卷持久化
    volumes:
      # 运行时数据（数据库、会话、用户附件等）
      - liri_data:/app/app/data
      # 日志文件
      - liri_logs:/app/app/logs
      # 用户知识库（可在宿主机上直接编辑 md 文件）
      - ../docs/知识库:/app/docs/知识库

    # ── 网络 ──
    ports:
      - "3000:3000"

    restart: unless-stopped

    # ── 健康检查 ──
    # oven/bun 基础镜像不保证自带 curl，用 bun 内建 fetch 探活。
    # 探测端点：/v1/health/report 由 LocalHTTPService 提供（端口 LIRI_HTTP_PORT=3000），
    # 就绪前也返回 200，适用于容器存活探活（区别于 daemon 模式 9090 /health）。
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/v1/health/report').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ── Watchtower 自动升级 ──
# 定期检查镜像仓库新版本，发现更新自动拉取并重建带
# com.centurylinklabs.watchtower.enable=true 标签的容器（即上面的 app 服务）。
# 仅影响本 compose 中标记的容器，不干扰服务器上其他容器。
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=300        # 检查间隔（秒），5 分钟
      - WATCHTOWER_LABEL_ENABLE=true        # 只升级带 enable 标签的容器
      - WATCHTOWER_CLEANUP=true             # 升级后清理旧镜像，防磁盘膨胀
      - WATCHTOWER_STOP_TIMEOUT=30s         # 容器优雅停止超时（Liri 落盘需要时间）
      # 若 ghcr.io/cocosoft/liri 设为私有镜像，需配置 GHCR 凭据（public 可删除）：
      # - REPO_USER=<ghcr 用户名>
      # - REPO_PASS=<ghcr PAT，权限 read:packages>

# ── 命名卷 ──
volumes:
  liri_data:
    driver: local
  liri_logs:
    driver: local
