# =============================================================================
#  Liri — Docker Compose 配置
#  官网：https://openliri.com
#  参考 Windows 版：exe 直接运行，等同 docker-compose up 后进入交互界面
# =============================================================================
#  快速开始：
#    首次构建： cd app && docker compose -f docker/docker-compose.yml build
#    交互模式： docker compose -f docker/docker-compose.yml run --rm app
#    后台服务： docker compose -f docker/docker-compose.yml up -d
#    查看日志： docker compose -f docker/docker-compose.yml logs -f
#    停止：     docker compose -f docker/docker-compose.yml down
#
#  简便方式（在 app/ 目录下）：
#    也可 cd app/docker && docker compose up -d
# =============================================================================

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # ── 交互模式（等同 Windows 版双击 Liri_coding.exe） ──
    #   docker compose -f docker/docker-compose.yml run --rm app
    #   如需传启动模式：docker compose -f docker/docker-compose.yml run --rm app mcp
    stdin_open: true
    tty: true

    # ── 环境变量 ──
    # 必须配置：DEEPSEEK_API_KEY
    # 从 .env 文件读取（和 Windows 版共用同一套配置）
    env_file:
      - ../.env
    environment:
      - LIRI_PROJECT_DIR=/app
      - LIRI_HOME=/app/app/data
      - LIRI_DATA_DIR=/app/app/data
      - LIRI_HTTP_PORT=3000
      - LIRI_HTTP_HOST=0.0.0.0

    # ── 持久化数据卷 ──
    # 数据库、会话、记忆等运行时数据通过卷持久化
    volumes:
      # 运行时数据（数据库、会话、用户附件等）
      - liri_data:/app/app/data
      # 日志文件
      - liri_logs:/app/app/logs
      # 用户知识库（可在宿主机上直接编辑 md 文件）
      - ../docs/知识库:/app/docs/知识库

    # ── 网络 ──
    ports:
      - "3000:3000"

    restart: unless-stopped

    # ── 健康检查 ──
    # oven/bun 基础镜像不保证自带 curl，用 bun 内建 fetch 探活。
    # 探测端点：/v1/health/report 由 LocalHTTPService 提供（端口 LIRI_HTTP_PORT=3000），
    # 就绪前也返回 200，适用于容器存活探活（区别于 daemon 模式 9090 /health）。
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/v1/health/report').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ── 命名卷 ──
volumes:
  liri_data:
    driver: local
  liri_logs:
    driver: local
