# =============================================================================
#  Liri — Docker Compose 配置
#  参考 Windows 版：exe 直接运行，等同 docker-compose up 后进入交互界面
# =============================================================================
#  快速开始：
#    首次构建： cd app && docker compose -f docker/docker-compose.yml build
#    交互模式： docker compose -f docker/docker-compose.yml run --rm app
#    后台服务： docker compose -f docker/docker-compose.yml up -d
#    查看日志： docker compose -f docker/docker-compose.yml logs -f
#    停止：     docker compose -f docker/docker-compose.yml down
#
#  简便方式（在 app/ 目录下）：
#    也可 cd app/docker && docker compose up -d
# =============================================================================

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # ── 交互模式（等同 Windows 版双击 Liri_coding.exe） ──
    #   docker compose -f docker/docker-compose.yml run --rm app
    #   如需传启动模式：docker compose -f docker/docker-compose.yml run --rm app mcp
    stdin_open: true
    tty: true

    # ── 环境变量 ──
    # 必须配置：DEEPSEEK_API_KEY
    # 从 .env 文件读取（和 Windows 版共用同一套配置）
    env_file:
      - ../.env
    environment:
      - PYAPP_PROJECT_DIR=/app
      - PYAPP_HOME=/app/app/data
      - PYAPP_DATA_DIR=/app/app/data

    # ── 持久化数据卷 ──
    # 数据库、会话、记忆等运行时数据通过卷持久化
    volumes:
      # 运行时数据（数据库、会话、用户附件等）
      - pyapp_data:/app/app/data
      # 日志文件
      - pyapp_logs:/app/app/logs
      # 用户知识库（可在宿主机上直接编辑 md 文件）
      - ../docs/知识库:/app/docs/知识库

    # ── 网络 ──
    ports:
      - "3000:3000"

    restart: unless-stopped

    # ── 健康检查 ──
    # 交互模式下 healthcheck 不适用，后台服务模式可取消注释
    # healthcheck:
    #   test: ["CMD-SHELL", "pgrep Liri_coding || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 30s

# ── 命名卷 ──
volumes:
  pyapp_data:
    driver: local
  pyapp_logs:
    driver: local
