[package]
name = "py-app-native"
version = "0.4.28"
edition = "2021"
description = "Liri Rust performance core - C ABI bindings (Bun FFI)"
authors = ["Liri Team"]
license = "MIT"
repository = "https://github.com/py-app/py-app"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
encoding_rs = "0.8"

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"

[features]
default = []
serde-support = ["serde", "serde_json"]
