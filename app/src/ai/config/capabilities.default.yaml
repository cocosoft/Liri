    descriptionFallback: "Supports JSON and other structured output formats"
    isDefault: false
    enabled: true
    taskTypes: ["chat", "default", "code"]
    sortOrder: 4
    sinceVersion: "0.4.0"
    dependencies: []

  # 视觉能力
