taskMappings:
  - taskType: chat
    requiredCapabilities: ["streaming", "function_calling", "tool_use"]
    optionalCapabilities: ["vision"]
    sortOrder: 1

  - taskType: default
    requiredCapabilities: ["streaming", "function_calling", "tool_use"]
    optionalCapabilities: []
    sortOrder: 2

  - taskType: image
    requiredCapabilities: ["image_generation"]
    optionalCapabilities: ["image_editing"]
    sortOrder: 3

  - taskType: video
    requiredCapabilities: ["video_generation"]
    optionalCapabilities: []
    sortOrder: 4

  - taskType: embedding
    requiredCapabilities: ["embedding"]
    optionalCapabilities: []
    sortOrder: 5

  - taskType: voice
    requiredCapabilities: []
    optionalCapabilities: ["text_to_speech", "speech_recognition"]
    sortOrder: 6

  - taskType: code
    requiredCapabilities: ["function_calling"]
    optionalCapabilities: ["code_execution", "bash_sandbox"]
    sortOrder: 7
