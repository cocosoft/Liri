# 模型能力默认配置基线
# 此文件随版本更新，用户自定义配置存储在数据库中

categories:
  - key: core
    labelKey: capability.category.core
    sortOrder: 1
  - key: vision
    labelKey: capability.category.vision
    sortOrder: 2
  - key: media
    labelKey: capability.category.media
    sortOrder: 3
  - key: tools
    labelKey: capability.category.tools
    sortOrder: 4
  - key: special
    labelKey: capability.category.special
    sortOrder: 5

capabilities:
  # 核心能力
  - key: streaming
    category: core
    labelKey: capability.streaming
    descriptionKey: capability.streaming.desc
    labelFallback: "Streaming"
    descriptionFallback: "Supports real-time streaming responses"
    isDefault: true
    enabled: true
    taskTypes: ["chat", "default"]
    sortOrder: 1
    sinceVersion: "0.4.0"
    dependencies: []

  - key: function_calling
    category: core
    labelKey: capability.function_calling
    descriptionKey: capability.function_calling.desc
    labelFallback: "Function Calling"
    descriptionFallback: "Supports calling external functions"
    isDefault: true
    enabled: true
    taskTypes: ["chat", "default", "code"]
    sortOrder: 2
    sinceVersion: "0.4.0"
    dependencies: []

  - key: thinking
    category: core
    labelKey: capability.thinking
    descriptionKey: capability.thinking.desc
    labelFallback: "Thinking"
    descriptionFallback: "Supports chain-of-thought reasoning"
    isDefault: false
    enabled: true
    taskTypes: ["chat", "default"]
    sortOrder: 3
    sinceVersion: "0.4.0"
    dependencies: []

  - key: structured_output
    category: core
