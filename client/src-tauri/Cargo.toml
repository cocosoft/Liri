[package]
name = "liri_client"
version = "0.4.35"
description = "Liri Desktop Client"
authors = ["Pengyun"]
license = "MIT"
homepage = "https://openliri.com"
repository = "https://openliri.com"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "liri_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
once_cell = "1.19"
futures-util = "0.3"
dirs = "5.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
panic = "abort"
