<svg xmlns="http://www.w3.org/2000/svg" viewBox="0  800 500">
  <rect width="800" height="500" fill="#1e1e2e" rx="12"/>

  <!--  -->
  <text x="400" y="50" text-anchormiddle" font-family="Georgia, serif" font-size="28" fill="#cdd6f4" font-weight="bold">✦ 经典数学公式 ✦</text>

  <!-- ============ 公式 1：欧拉恒等式 ============ -->
  <text x="50" y="100" font-family="Georgia, serif" font-size="18" fill="#89b4fa" font-weight="bold">① 欧拉恒等式</text>
  <text x="50" y="140" font-family="Georgia, serif" font-size="32" fill="#f5c2e7" font-style="italic">e</text>
  <text x="71" y="125" font-family="Georgia, serif" font-size="18" fill="#f5c2e7" font-style="italic">iπ</text>
  <text x="95" y="140" font-family="Georgia, serif" font-size="28" fill="#f5c2e7">+ 1 = 0</text>

  <!-- 说明 -->
  <text x="50" y="170" font-family="Georgia, serif" font-size="14" fill="#a6adc8">五个最重要的数学常数在同一个等式里</text>

  <!-- ============ 公式 2：勾股定理 ============ -->
  <text x="50" y="220" font-family="Georgia, serif" font-size="18" fill="#89b4fa" font-weight="bold">② 勾股定理</text>
  <text x="50" y="258" font-family="Georgia, serif" font-size="28" fill="#a6e3a1">a² + b² = c²</text>
  <text x="50" y="288" font-family="Georgia, serif" font-size="14" fill="#a6adc8">直角三角形斜边的平方 = 两直角边平方之和</text>

  <!-- ============ 公式 3：质数定理 ============ -->
  <text x="50" y="338" font-family="Georgia, serif" font-size="18" fill="#89b4fa" font-weight="bold">③ 质数定理</text>
  <text x="50" y="378" font-family="Georgia, serif" font-size="26" fill="#fab387">π(x) ∼ x / ln(x)</text>
  <text x="50" y="408" font-family="Georgia, serif" font-size="14" fill="#a6adc8">不超过 x 的质数个数近似为 x / ln(x)</text>

  <!-- ============ 公式 4：正态分布 ============ -->
  <text x="50" y="458" font-family="Georgia, serif" font-size="18" fill="#89b4fa" font-weight="bold">④ 正态分布</text>
  <text x="220" y="458" font-family="Georgia, serif" font-size="22" fill="#cba6f7">f(x) =</text>
  <text x="290" y="450" font-family="Georgia, serif" font-size="16" fill="#cba6f7">1</text>
  <line x1="285" y1="452" x2="380" y2="452" stroke="#cba6f7" stroke-width="1.5"/>
  <text x="285" y="470" font-family="Georgia, serif" font-size="14" fill="#cba6f7">σ√(2π)</text>
  <text x="390" y="458" font-family="Georgia, serif" font-size="22" fill="#cba6f7">· e</text>
 <text x="418" y="445" font-family="Georgia, serif" font-size="14" fill="#cba6f7">−(x−μ)² / 2σ²</text>

  <!-- 右侧装饰线 -->
  <line x1="540" y1="80" x2="540" y2="460" stroke="#313244" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ============ 公式 5：傅里叶级数 ============ -->
  <text x="560" y="100" font-family="Georgia, serif" font-size="18" fill="#89b4fa" font-weight="bold">⑤ 傅里叶级数</text>
  <text x="560" y="138" font-family="Georgia, serif" font-size="18" fill="#94e2d5">f(x) = a₀ + Σ[aₙcos(nx) + bₙsin(nx)]</text>

  <!-- ============ 公式 6：麦克斯韦方程组 ============ -->
  <text x="560" y="188" font-family="Georgia, serif" font-size="18" fill="#89b4fa" font-weight="bold">⑥ 麦克斯韦方程组</text>
  <text x="560" y="218" font-family="Georgia, serif" font-size="18" fill="#f38ba8">∇ · E = ρ / ε₀</text>
  <text x="560" y="245" font-family="Georgia, serif" font-size="18" fill="#f38ba8">∇ · B = 0</text>
  <text x="560" y="272" font-family="Georgia, serif" font-size="18" fill="#f38ba8">∇ × E = −∂B/∂t</text>
  <text x="560" y="299" font-family="Georgia, serif" font-size="18" fill="#f38ba8">∇ × B = μ₀J + μ₀ε₀∂E/∂t</text>

  <!-- ============ 公式 7：薛定谔方程 ============ -->
  <text x="560" y="348" font-family="Georgia, serif" font-size="18" fill="#89b4fa" font-weight="bold">⑦ 薛定谔方程</text>
  <text x="560" y="385" font-family="Georgia, serif" font-size="17" fill="#f9e2af">iℏ · ∂Ψ/∂t = ĤΨ</text>

  <!-- ============ 公式 8：Einstein 质能 ============ -->
  <text x="560" y="435" font-family="Georgia, serif" font-size="18" fill="#89b4fa" font-weight="bold">⑧ 质能等价</text>
  <text x="560" y="470" font-family="Georgia, serif" font-size="28" fill="#74c7ec" font-weight="bold">E = mc²</text>
</svg>