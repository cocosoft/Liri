[package]
name = "pyapp-native"
version = "0.1.0"
edition = "2021"
description = "PY_APP Rust native FFI module — context compression & token estimation"

# 跨平台构建：
#   cargo build --release                           → 宿主平台
#   cargo build --release --target x86_64-unknown-linux-gnu   → Linux (Docker)
#   cargo build --release --target x86_64-apple-darwin        → macOS Intel
#   cargo build --release --target aarch64-apple-darwin       → macOS Apple Silicon
#   cargo build --release --target x86_64-pc-windows-msvc     → Windows MSVC
#
# Windows MSVC 需要 Visual Studio Build Tools 或 rustup default stable-gnu

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
